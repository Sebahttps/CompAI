<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Acceso · Tripu</title>
<meta name="viewport" content="width=390, initial-scale=1">
</head>
<body>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;family=Nunito+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>html{background:#E6E3F0;display:flex;justify-content:center;min-height:100%}
body{margin:0;font-family:'Nunito Sans',system-ui,sans-serif;color:#16123A;background:#F3F2F9;-webkit-font-smoothing:antialiased}
a{color:#1B0088;text-decoration:none}a:hover{color:#D6103F}
h1,h2,h3,h4{font-family:'Plus Jakarta Sans','Nunito Sans',sans-serif;margin:0;letter-spacing:-0.01em}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.nav a{display:flex;align-items:center;gap:14px;height:48px;padding:0 20px;border-radius:12px;color:#CFC9F0;font-weight:600;font-size:15px}
.nav a:hover{background:rgba(255,255,255,.08);color:#fff}
.nav a.on{background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 3px 0 0 #D6103F}
.chip{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:12px;background:#fff;border:1px solid #E3E1EE;font-weight:700;font-size:14px;color:#16123A}
.chip.on{background:#1B0088;color:#fff;border-color:#1B0088}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 20px;border-radius:12px;font-weight:700;font-size:15px}
.btn.p{background:#D6103F;color:#fff}.btn.p:hover{background:#B80D35;color:#fff}
.btn.s{background:#fff;color:#1B0088;border:1.5px solid #1B0088}.btn.s:hover{background:#ECE9F8;color:#1B0088}
.btn.g{background:#ECE9F8;color:#1B0088}.btn.g:hover{background:#DDD8F3;color:#1B0088}
.iconbtn{width:44px;height:44px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:#5B5780;background:#fff;border:1px solid #E3E1EE}
.iconbtn:hover{color:#1B0088;background:#ECE9F8}
.card{background:#fff;border-radius:18px;border:1px solid #E3E1EE;box-shadow:0 1px 2px rgba(22,18,58,.04)}
.tag{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px 0 6px;border-radius:999px;font-size:13px;font-weight:700}
.tag i{width:22px;height:22px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-style:normal}
.meta{font-size:13px;color:#5B5780}
.av{width:36px;height:36px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff;font-family:'Plus Jakarta Sans',sans-serif;flex-shrink:0}
.input{display:flex;align-items:center;gap:10px;height:48px;padding:0 16px;border-radius:12px;background:#fff;border:1.5px solid #E3E1EE;color:#5B5780;font-size:15px}
.input:focus-within{border-color:#1B0088}
.input input,.input textarea{border:0;outline:0;background:transparent;flex-grow:1;color:#16123A;min-width:0}
.tab{height:44px;padding:0 4px;display:inline-flex;align-items:center;font-weight:700;color:#5B5780;border-bottom:3px solid transparent}
.tab.on{color:#1B0088;border-bottom-color:#D6103F}
</style>
<div style="width:390px;min-height:844px;display:flex;flex-direction:column;box-sizing:border-box;background:#fff;position:relative"><section style="position:relative;height:400px;flex-shrink:0;background:linear-gradient(160deg,#1B0088,#0B0038);color:#fff;overflow:hidden;display:flex;flex-direction:column">
    <img src="../media/hero-tripulacion.jpg" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;opacity:.6;-webkit-mask-image:linear-gradient(180deg,#000 30%,transparent 100%);mask-image:linear-gradient(180deg,#000 30%,transparent 100%)">
    <div style="position:relative"><div style="height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:14px;font-weight:800;color:#fff;flex-shrink:0"><span>9:41</span><span style="display:inline-flex;gap:6px;align-items:center"><svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor" aria-hidden="true"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg width="26" height="12" viewBox="0 0 26 12" fill="none" stroke="currentColor" aria-hidden="true"><rect x="0.5" y="0.5" width="22" height="11" rx="3"/><rect x="2.5" y="2.5" width="16" height="7" rx="1.5" fill="currentColor" stroke="none"/><path d="M24 4v4" stroke-width="1.5"/></svg></span></div></div>
    <div style="position:relative;display:flex;align-items:center;gap:10px;padding:8px 24px"><span style="width:38px;height:38px;border-radius:11px;background:#D6103F;display:inline-flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 13l-8-3V4.5A1.5 1.5 0 0011.5 3 1.5 1.5 0 0010 4.5V10l-8 3v2l8-2v4l-2 1.5V20l3.5-1 3.5 1v-1.5L13 17v-4l8 2z"/></svg></span><div style="display:flex;flex-direction:column;line-height:1.1"><span style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:18px;letter-spacing:.06em">LATAM</span><span style="font-size:10px;letter-spacing:.18em;color:#CFC9F0">AIRLINES</span></div></div>
    <div style="position:relative;margin-top:auto;padding:0 24px 28px;display:flex;flex-direction:column;gap:8px"><span style="font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#FFB3C4">Buenas prácticas de la tripulación</span><h1 style="font-size:44px;font-weight:800;line-height:1">Tripu</h1><p style="margin:0;font-size:15px;line-height:1.45;color:#E7E3FF">Lo que nos hace volar más alto. De tripulantes, para tripulantes.</p></div>
  </section>
  <form style="display:flex;flex-direction:column;gap:14px;padding:24px 24px 0">
    <div style="display:flex;flex-direction:column;gap:6px"><label for="correo" style="font-weight:800;font-size:14px">Ingresa con tu correo LATAM</label><label class="input" style="height:52px"><span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></span><input id="correo" type="email" value="rigo.m" aria-label="Correo corporativo"><span style="font-weight:700;color:#1B0088;font-size:14px">@latam.com</span></label></div>
    <a href="Inicio.html" class="btn p" style="height:52px;font-size:16px">Continuar <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
    <div style="display:flex;align-items:center;gap:12px;color:#5B5780;font-size:12px"><span style="flex-grow:1;height:1px;background:#E3E1EE"></span>o<span style="flex-grow:1;height:1px;background:#E3E1EE"></span></div>
    <a href="Inicio.html" class="btn s" style="height:48px;font-size:14px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg> Acceso único corporativo (SSO)</a>
    <p class="meta" style="margin:6px 0 0;font-size:12px;line-height:1.5;text-align:center">Espacio interno. Solo tripulantes con cuenta LATAM. Tu nombre y base acompañan cada aporte.</p>
  </form>
  <div style="margin-top:auto;padding:0 24px 24px;display:flex;align-items:center;justify-content:center;gap:8px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:15px;color:#16123A"><span style="color:#D6103F"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 13l-8-3V4.5A1.5 1.5 0 0011.5 3 1.5 1.5 0 0010 4.5V10l-8 3v2l8-2v4l-2 1.5V20l3.5-1 3.5 1v-1.5L13 17v-4l8 2z"/></svg></span><span>OTP<span style="color:#D6103F">SYNC</span></span><span style="font-family:'Nunito Sans',sans-serif;font-weight:600;font-size:12px;color:#5B5780;margin-left:4px">Juntos, cada vuelo cuenta.</span></div></div>
</body>
</html>

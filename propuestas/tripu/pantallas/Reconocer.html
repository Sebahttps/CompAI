<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Reconocer a un compañero</title>
<meta name="viewport" content="width=390, initial-scale=1">
</head>
<body>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;family=Nunito+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>html{background:#E6E3F0;display:flex;justify-content:center;min-height:100%}
body{margin:0;font-family:'Nunito Sans',system-ui,sans-serif;color:#16123A;background:#F3F2F9;-webkit-font-smoothing:antialiased}
a{color:#1B0088;text-decoration:none}a:hover{color:#D6103F}
h1,h2,h3,h4{font-family:'Plus Jakarta Sans','Nunito Sans',sans-serif;margin:0;letter-spacing:-0.01em}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.nav a{display:flex;align-items:center;gap:14px;height:48px;padding:0 20px;border-radius:12px;color:#CFC9F0;font-weight:600;font-size:15px}
.nav a:hover{background:rgba(255,255,255,.08);color:#fff}
.nav a.on{background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 3px 0 0 #D6103F}
.chip{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:12px;background:#fff;border:1px solid #E3E1EE;font-weight:700;font-size:14px;color:#16123A}
.chip.on{background:#1B0088;color:#fff;border-color:#1B0088}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 20px;border-radius:12px;font-weight:700;font-size:15px}
.btn.p{background:#D6103F;color:#fff}.btn.p:hover{background:#B80D35;color:#fff}
.btn.s{background:#fff;color:#1B0088;border:1.5px solid #1B0088}.btn.s:hover{background:#ECE9F8;color:#1B0088}
.btn.g{background:#ECE9F8;color:#1B0088}.btn.g:hover{background:#DDD8F3;color:#1B0088}
.iconbtn{width:44px;height:44px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:#5B5780;background:#fff;border:1px solid #E3E1EE}
.iconbtn:hover{color:#1B0088;background:#ECE9F8}
.card{background:#fff;border-radius:18px;border:1px solid #E3E1EE;box-shadow:0 1px 2px rgba(22,18,58,.04)}
.tag{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px 0 6px;border-radius:999px;font-size:13px;font-weight:700}
.tag i{width:22px;height:22px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-style:normal}
.meta{font-size:13px;color:#5B5780}
.av{width:36px;height:36px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff;font-family:'Plus Jakarta Sans',sans-serif;flex-shrink:0}
.input{display:flex;align-items:center;gap:10px;height:48px;padding:0 16px;border-radius:12px;background:#fff;border:1.5px solid #E3E1EE;color:#5B5780;font-size:15px}
.input:focus-within{border-color:#1B0088}
.input input,.input textarea{border:0;outline:0;background:transparent;flex-grow:1;color:#16123A;min-width:0}
.tab{height:44px;padding:0 4px;display:inline-flex;align-items:center;font-weight:700;color:#5B5780;border-bottom:3px solid transparent}
.tab.on{color:#1B0088;border-bottom-color:#D6103F}
</style>
<div style="width:390px;min-height:844px;display:flex;flex-direction:column;box-sizing:border-box;background:#F3F2F9;position:relative"><header style="background:#fff;border-bottom:1px solid #E3E1EE;flex-shrink:0;display:flex;flex-direction:column"><div style="height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:14px;font-weight:800;color:#16123A;flex-shrink:0"><span>9:41</span><span style="display:inline-flex;gap:6px;align-items:center"><svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor" aria-hidden="true"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg width="26" height="12" viewBox="0 0 26 12" fill="none" stroke="currentColor" aria-hidden="true"><rect x="0.5" y="0.5" width="22" height="11" rx="3"/><rect x="2.5" y="2.5" width="16" height="7" rx="1.5" fill="currentColor" stroke="none"/><path d="M24 4v4" stroke-width="1.5"/></svg></span></div>
    <div style="height:52px;display:flex;align-items:center;gap:10px;padding:0 12px 0 8px"><a href="Momentos.html" aria-label="Volver" class="iconbtn" style="border:0;color:#16123A"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></a><h1 style="font-size:18px;font-weight:800;flex-grow:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Reconocer a un compañero</h1></div>
  </header>
  <form style="display:flex;flex-direction:column;gap:14px;padding:16px 20px 110px;flex-grow:1;overflow:hidden">
    <p class="meta" style="margin:0;font-size:13px;line-height:1.45">Un reconocimiento se publica en Momentos y llega al perfil de la persona. Cuesta 30 segundos y se recuerda semanas.</p>
    <div style="display:flex;flex-direction:column;gap:8px"><span style="font-weight:800;font-size:13px">¿A quién?</span><label class="input" style="height:44px"><span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/></svg></span><input type="search" value="Cam" aria-label="Buscar compañero"></label><div style="display:flex;flex-direction:column;gap:6px"><button type="button" style="display:flex;align-items:center;gap:10px;height:52px;padding:0 12px;border-radius:12px;background:#ECE9F8;border:1.5px solid #1B0088;text-align:left"><span class="av" style="width:34px;height:34px;background:#5A1FB8;font-size:12px">CT</span><span style="display:flex;flex-direction:column;line-height:1.2"><span style="font-weight:800;font-size:14px">Camila T.</span><span class="meta" style="font-size:12px">Tripulante · SCL</span></span><span style="margin-left:auto;color:#1B0088"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span></button><button type="button" style="display:flex;align-items:center;gap:10px;height:52px;padding:0 12px;border-radius:12px;background:#fff;border:1.5px solid #E3E1EE;text-align:left"><span class="av" style="width:34px;height:34px;background:#8A4B00;font-size:12px">JP</span><span style="display:flex;flex-direction:column;line-height:1.2"><span style="font-weight:800;font-size:14px">Javier P.</span><span class="meta" style="font-size:12px">Tripulante · SCL</span></span></button><button type="button" style="display:flex;align-items:center;gap:10px;height:52px;padding:0 12px;border-radius:12px;background:#fff;border:1.5px solid #E3E1EE;text-align:left"><span class="av" style="width:34px;height:34px;background:#5A1FB8;font-size:12px">VS</span><span style="display:flex;flex-direction:column;line-height:1.2"><span style="font-weight:800;font-size:14px">Valentina S.</span><span class="meta" style="font-size:12px">Tripulante · LIM</span></span></button></div></div>
    <div style="display:flex;flex-direction:column;gap:8px"><span style="font-weight:800;font-size:13px">¿Por qué?</span><div style="display:flex;gap:6px;flex-wrap:wrap"><button type="button" class="chip on" style="height:38px;font-size:12px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg> Cuidó la seguridad</button><button type="button" class="chip" style="height:38px;font-size:12px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0113 0"/><path d="M16 4.5a3.5 3.5 0 010 7"/><path d="M17.5 14a6 6 0 014 6"/></svg> Atención HBC</button><button type="button" class="chip" style="height:38px;font-size:12px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg> Puntualidad</button><button type="button" class="chip" style="height:38px;font-size:12px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.5-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.5-7 10-7 10z"/></svg> Apoyó al equipo</button><button type="button" class="chip" style="height:38px;font-size:12px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg> Actitud LATAM</button></div></div>
    <div style="display:flex;flex-direction:column;gap:8px"><span style="font-weight:800;font-size:13px">Cuéntalo en una frase</span><label class="input" style="height:auto;align-items:flex-start;padding:10px 14px;font-size:14px"><textarea rows="3" style="resize:none;line-height:1.4" aria-label="Mensaje">Se dio cuenta de una tapa de compartimento mal cerrada que dos revisiones habían pasado. Ese ojo nos cuida a todos.</textarea></label></div>
    <label style="display:flex;align-items:center;gap:10px;font-size:13px"><input type="checkbox" checked style="width:20px;height:20px;accent-color:#1B0088"> Mostrar en Momentos para toda la tripulación</label>
  </form>
  <div style="position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #E3E1EE;padding:12px 20px 28px"><a href="Momentos.html" class="btn p" style="height:50px;font-size:15px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="9" r="5.5"/><path d="M8.5 13.5L7 21l5-2.5L17 21l-1.5-7.5"/></svg> Enviar reconocimiento</a></div></div>
</body>
</html>

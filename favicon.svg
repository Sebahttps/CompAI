<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="compAI">
  <title>compAI — favicon</title>
  <!-- CANONICO. Copia de `marca/svg/compai-favicon.svg`, 11-sep-2026.
       El lockup completo no se lee en cuadrado: en avatar y pestaña va solo el
       doble check (manual de diseño compAI BLUE, 09).
       CAMBIO DE FONDO, y es una mejora medida: antes era check de color sobre
       placa oscura #080A09; el manual manda placa AZUL DIA #0F5C7A con el check
       en blanco marca #F5F0E4. Contraste 6,52:1 contra los 5,40:1 que daria el
       azul del símbolo sobre la placa oscura. Se gana lectura a 16 px, que es
       justo lo que esta pieza tiene que resolver.
       El radio es proporcional, no absoluto: rx 14 en 64 = rx 112 en 512. -->
  <rect width="64" height="64" rx="14" fill="#0F5C7A"/>
  <g transform="translate(9.15 14.87) scale(2.07780)">
    <g fill="none" stroke="#F5F0E4" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1 8.5 L5 12.5 L12 4"/>
      <path d="M10 8.5 L14 12.5 L21 4"/>
    </g>
  </g>
</svg>

html,body{margin:0;padding:0}

/* LA PUERTA ACOTA SU PROPIA CAJA, Y SOLO LA SUYA (19-09-2026).
   Esta regla se llamaba `.caja` a secas y el contenido descifrado
   TAMBIEN tiene una `.caja` — la del semaforo. El `<style>` de la
   puerta vive en el <head> y no se borra al descifrar, asi que la
   caja del semaforo quedaba topada en 420 px: sus seis celdas se
   apilaban en columna y estiraban la pagina entera. Es lo que
   Sebastian vio y llamo «un margen que alarga mucho el diseno», y no
   era un margen: era este max-width sin dueno. Ahora esta rotulada
   con su padre. */
.puerta .caja{width:100%;max-width:420px;text-align:center}
.marca{font-family:var(--font-data,ui-monospace,monospace);font-size:12px;
  letter-spacing:.18em;text-transform:uppercase;color:var(--crema-60,#96948E);
  margin:0 0 28px}
h1{font-family:var(--font-data,ui-monospace,monospace);font-weight:600;
  font-size:clamp(20px,4vw,28px);margin:0 0 8px}
p.sub{color:var(--crema-75,#BAB6AE);font-size:15px;line-height:1.5;margin:0 0 28px}
input{width:100%;padding:14px 16px;font-size:16px;

  color:var(--crema,#F5F0E4);background:rgba(255,255,255,.04);
  border:1px solid var(--crema-28,#4A4A48);border-radius:8px;outline:none}
/* AZUL Y NO VERDE (Visu, 11-sep-2026). El foco es traza —dice dónde
   está el teclado— y la traza es azul desde el 9-sep. Además el
   respaldo importaba de verdad: el :root de esta puerta sale del
   landing, que ya no declara `--menta`, así que el borde de foco
   estaba cayendo SIEMPRE en el verde retirado del respaldo. */
input:focus{border-color:var(--azul,#2E8FB5)}
button{width:100%;margin-top:12px;padding:14px 16px;font-size:14px;
  font-family:var(--font-data,ui-monospace,monospace);font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;cursor:pointer;
  color:#08090C;background:var(--terracota,#C87941);border:0;border-radius:8px}
button:disabled{opacity:.5;cursor:default}
.aviso{margin-top:18px;min-height:20px;font-size:13px;
  font-family:var(--font-data,ui-monospace,monospace);color:var(--alerta-300,#F0A0A0)}
.pie{margin-top:34px;font-size:11px;color:var(--crema-60,#96948E)}
.pie a{color:inherit}

<div class="puerta" id="puerta">
  <div class="caja">
    <p class="marca">compAI &middot; intranet</p>
    <h1>Documento interno</h1>
    <p class="sub">Esta p&aacute;gina es interna. Escribe la clave para abrirla.</p>
    <form id="f">
      <!-- `current-password` en vez de `off`: deja que el gestor de Chrome/Windows
         ofrezca guardar la clave y autocompletarla. Decision de Sebastian el
         12-09-2026, eligiendo esto por sobre `localStorage`.
         La diferencia importa: asi la clave la protege la sesion de Windows y
         se revoca desde Chrome, en vez de quedar en el propio navegador
         legible por el JavaScript de esta pagina. Con `off` el gestor ni
         siquiera lo ofrecia. -->
      <input id="clave" type="password" autocomplete="current-password" spellcheck="false"
             placeholder="clave" aria-label="Clave">
      <button id="b" type="submit">Abrir</button>
    </form>
    <p class="aviso" id="aviso" role="status" aria-live="polite"></p>
    <p class="pie">&iquest;Llegaste por error? <a href="/">compai.cl</a></p>
  </div>
</div>
<script>/* tablero_cripto_nucleo.js — el cifrado real del tablero. PAIton, 4-sep-2026.

   UN SOLO ARCHIVO PARA LAS DOS PUNTAS. El navegador lo ejecuta tal cual,
   pegado dentro de la página (`tablero.py` lo lee como texto e inyecta, igual
   que ya hace con `:root` y `<defs>` del index — "SOLO LEE"). Node lo importa
   con `require()` para construir la carga cifrada (`tablero_cifrar.js`) y para
   las pruebas. Es EL MISMO texto en las dos puntas por construcción, no por
   disciplina: no hay forma de que la versión que cifra y la que descifra se
   desincronicen, porque son un solo archivo.

   Por eso no usa `require` en el cuerpo (rompería en el navegador) y expone
   su API por `module.exports` SOLO si existe `module` (Node); si no, cuelga
   `TABLERO_CRIPTO` de `globalThis` (navegador). Nada de import/export ES
   módulos: así se pega crudo dentro de un <script> sin type=module.

   QUÉ DECIDIÓ SEBASTIÁN Y QUÉ IMPLEMENTA ESTO
   · Cifrado real, no una clave comparada en JavaScript: sin la clave no hay
     nada legible en el código fuente publicado.
   · Esto NO SE PUEDE REVOCAR: quien copie la carga cifrada la tiene para
     siempre y puede probar claves sin límite ni registro. Por eso la
     derivación es LENTA A PROPÓSITO — PBKDF2-HMAC-SHA256 con 600.000
     iteraciones (piso que recomienda OWASP 2023 para PBKDF2-SHA256) — y con
     SAL propia por carga, así que precalcular una tabla sirve para una sola
     publicación, no para todas.
   · Todo con `crypto.subtle` nativo. Cero librerías: lo que no se importa no
     se puede envenenar ni dejar de cargar.

   EL PUNTO DE DISEÑO CENTRAL: UNA SOLA DERIVACIÓN, DOS LLAVES.
   La clave que se escribe en la puerta deriva 512 bits de una vez: los primeros 256
   son la llave AES-256-GCM que abre la LECTURA (la carga que viaja dentro del
   HTML); los últimos 256 son la llave HMAC-SHA256 que firma la ESCRITURA
   (aprobar/devolver/preguntar/deshacer contra el Apps Script). Responde la
   pregunta de si lectura y escritura deben compartir camino: comparten la
   CLAVE y la DERIVACIÓN, no el CANAL — la lectura no sale nunca del
   navegador (no hay fetch: la carga ya viaja en el propio documento) y la
   escritura sí necesita cruzar a un servidor porque hay que persistir la
   decisión en algún lugar durable. Quien no conoce la clave no puede ni leer
   ni firmar una escritura: no hay un segundo secreto suelto en el HTML.

   FORMATO DE LA CARGA: base64( salt(16B) . iv(12B) . ciphertext+tag(AES-GCM) ).

   EL RECHAZO NO DISTINGUE. `descifrar()` funde en un solo camino de rechazo
   la clave mala, la carga corrupta y la carga vacía: AES-GCM es cifrado
   AUTENTICADO — el tag falla ANTES de que exista texto plano que parsear, así
   que nunca hay un JSON corrupto que "casi" se lee. Cualquier fallo, mismo
   catch, mismo Error genérico. La página (tablero.py) ya colapsa cualquier
   rechazo que no sea "no hay carga en absoluto" al mismo aviso: "No es esa
   clave.".
*/
(function (global) {
  'use strict';

  var ITERACIONES = 600000;
  var LARGO_SALT = 16;   // bytes
  var LARGO_IV = 12;     // bytes, el estándar para AES-GCM
  var LARGO_MINIMO_CARGA = LARGO_SALT + LARGO_IV + 16; // + el tag mínimo de GCM

  function b64(bytes) {
    var bin = '';
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return global.btoa(bin);
  }

  function unb64(str) {
    var bin = global.atob(str);
    var out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  // Una sola derivación PBKDF2, lenta a propósito; de ahí se parten las dos
  // llaves. `noExtraible` (true por defecto) hace que las CryptoKey nunca se
  // puedan volver a exportar como bytes crudos, ni siquiera desde la consola
  // del navegador con el objeto ya en memoria — defensa en profundidad, no la
  // protección principal (esa es no guardar la clave de texto en ningún
  // lado).
  function derivar(clave, saltBytes, noExtraible) {
    var extraible = noExtraible === false; // por defecto no extraible
    var enc = new global.TextEncoder();
    return global.crypto.subtle
      .importKey('raw', enc.encode(clave), 'PBKDF2', false, ['deriveBits'])
      .then(function (base) {
        return global.crypto.subtle.deriveBits(
          { name: 'PBKDF2', salt: saltBytes, iterations: ITERACIONES, hash: 'SHA-256' },
          base,
          512
        );
      })
      .then(function (bits) {
        var todos = new Uint8Array(bits);
        var aesBytes = todos.slice(0, 32);
        var hmacBytes = todos.slice(32, 64);
        return Promise.all([
          global.crypto.subtle.importKey('raw', aesBytes, { name: 'AES-GCM' }, extraible, ['encrypt', 'decrypt']),
          global.crypto.subtle.importKey('raw', hmacBytes, { name: 'HMAC', hash: 'SHA-256' }, extraible, ['sign', 'verify'])
        ]).then(function (k) {
          return { aesKey: k[0], hmacKey: k[1], hmacBytes: hmacBytes };
        });
      });
  }

  // Cifra un objeto plano. SOLO se usa en el build (Node): la página nunca
  // cifra, solo descifra. `noExtraible` en false aquí a propósito: el build
  // necesita poder volver a leer los bytes para imprimir la llave HMAC que
  // hay que pegar en Apps Script.
  function cifrar(clave, objetoPlano) {
    var salt = global.crypto.getRandomValues(new Uint8Array(LARGO_SALT));
    var iv = global.crypto.getRandomValues(new Uint8Array(LARGO_IV));
    return derivar(clave, salt, false).then(function (k) {
      var enc = new global.TextEncoder();
      var datos = enc.encode(JSON.stringify(objetoPlano));
      return global.crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, k.aesKey, datos).then(function (ct) {
        var out = new Uint8Array(salt.length + iv.length + ct.byteLength);
        out.set(salt, 0);
        out.set(iv, salt.length);
        out.set(new Uint8Array(ct), salt.length + iv.length);
        return { carga: b64(out), hmacKeyBase64: b64(k.hmacBytes) };
      });
    });
  }

  // Descifra. Resuelve con {estado, hmacKey} — el ENGANCHE PÚBLICO
  // (window.TABLERO.descifrar, armado en tablero.py) solo entrega `estado`
  // hacia afuera y se queda con `hmacKey` para firmar escrituras después,
  // tal como pide el contrato: "la clave no se guarda", pero la llave
  // DERIVADA sí puede vivir en memoria mientras dura la sesión — es lo único
  // que permite `escribir()`/`deshacer()` sin volver a pedirla.
  function descifrar(claveTexto, cargaB64) {
    return Promise.resolve().then(function () {
      if (!cargaB64) throw new Error('sin carga');
      var todo;
      try {
        todo = unb64(cargaB64);
      } catch (e) {
        throw new Error('carga corrupta');
      }
      if (todo.length < LARGO_MINIMO_CARGA) throw new Error('carga corrupta');
      var salt = todo.slice(0, LARGO_SALT);
      var iv = todo.slice(LARGO_SALT, LARGO_SALT + LARGO_IV);
      var ct = todo.slice(LARGO_SALT + LARGO_IV);
      return derivar(claveTexto, salt).then(function (k) {
        return global.crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, k.aesKey, ct).then(function (pt) {
          var texto = new global.TextDecoder().decode(pt);
          return { estado: JSON.parse(texto), hmacKey: k.hmacKey };
        });
      });
      // Cualquier fallo de acá para abajo (clave mala → falla el tag de GCM
      // antes de que exista texto plano; JSON corrupto si algún día lo
      // hubiera) sale como rechazo genérico: no hay un `catch` que reformule
      // el mensaje, y es a propósito — el que prueba claves no debe aprender
      // nada del tiempo de respuesta ni del texto del error.
    });
  }

  // Firma un mensaje canónico con la llave HMAC de la sesión. Se usa igual
  // para `escribir` y para `deshacer`: el mensaje cambia, el mecanismo no.
  function firmar(hmacKey, mensajeTexto) {
    var enc = new global.TextEncoder();
    return global.crypto.subtle.sign('HMAC', hmacKey, enc.encode(mensajeTexto)).then(function (sig) {
      return b64(new Uint8Array(sig));
    });
  }

  var API = {
    cifrar: cifrar,
    descifrar: descifrar,
    firmar: firmar,
    derivar: derivar,
    b64: b64,
    unb64: unb64,
    ITERACIONES: ITERACIONES
  };

  if (typeof module !== 'undefined' && module.exports) {
    module.exports = API;
  } else {
    global.TABLERO_CRIPTO = API;
  }
})(typeof globalThis !== 'undefined' ? globalThis : this);

      puerta=document.getElementById("puerta");

  function malo(borrarSesion){
    av.textContent="Esa clave no abre.";
    b.disabled=false; inp.value=""; inp.focus();
    if(borrarSesion){ try{ sessionStorage.removeItem(LLAVE_SESION); }catch(_e){} }
  }

  function abrir(c, esAutomatico){
    if(!window.TABLERO_CRIPTO || !window.TABLERO_CRIPTO.descifrar){
      av.textContent="Falta el nucleo de cifrado en la pagina."; b.disabled=false; return;
    }
    b.disabled=true; av.textContent=esAutomatico?"":"Abriendo\u2026";
    window.TABLERO_CRIPTO.descifrar(c, window.__CARGA).then(function(r){
      var d = r && r.estado;
      if(!d||!d.cuerpo){ malo(esAutomatico); return; }
      var st=document.createElement("style");
      st.textContent=d.estilos||"";
      document.head.appendChild(st);
      if(puerta&&puerta.parentNode) puerta.parentNode.removeChild(puerta);
      document.body.innerHTML=d.cuerpo;
      document.title="Mapa del sistema \u00b7 COMPAI GLOBAL SOLUTIONS SPA";
      try{ sessionStorage.setItem(LLAVE_SESION, c); }catch(_e){}
      c=null;
    }).catch(function(){ malo(esAutomatico); });
  }

  f.addEventListener("submit", function(e){
    e.preventDefault();
    var c=inp.value||"";
    if(!c){ inp.focus(); return; }
    abrir(c, false);
  });

  // ENGANCHE DE SESION: si `/estado/` ya guardo la clave en esta MISMA
  // pestana, se prueba sola y la puerta nunca se ve — igual que hace
  // `tablero.py`. Si falla (clave vieja, storage corrupto), cae en el mismo
  // camino de error que un clic fallido y de paso borra lo guardado.
  var previa = null;
  try{ previa = sessionStorage.getItem(LLAVE_SESION); }catch(_e){}
  if(previa){ abrir(previa, true); } else { inp.focus(); }
})();
</script>
</body>
</html>

(function(){
  'use strict';
  // La URL no es secreta: la protege la firma HMAC de cada escritura, no
  // desconocerla. Ver panel-admin/TABLERO-LEEME.md.
  var URL_ESCRITURA = "https://script.google.com/macros/s/AKfycbzjW0zUA0DN-SZRkkUlF86KYoVmGgUvpuJK_SqZJ0_mUr1BTY1HmMbiuJhSqmwIF8LW/exec";
  // Qué compilación es esta. La palabra no delata nada —no dice de qué va el
  // documento— y en cambio permite que el aviso de adentro sea derivado en
  // vez de escrito a mano en el HTML servido.
  var MODO = "conectado";
  var _hmacKey = null;
  function canon(campos){
    return campos.map(function(v){ return v==null ? '' : String(v) }).join('|');
  }
  // El otro lado puede contestar algo que NO es JSON, y `resp.json()` a secas
  // convierte eso en «SyntaxError: Unexpected token» — un mensaje que no dice
  // qué pasó ni qué hacer. Pasó en producción el 19-sep-2026: el backend
  // devolvía el texto de `doGet` («tablero: solo POST») porque el despliegue
  // de Apps Script no estaba publicado con acceso «Cualquiera».
  // Esto lee la respuesta como TEXTO y la traduce a una causa concreta. No
  // inventa un éxito en ningún caso: lo que no es un JSON con ok:true sigue
  // siendo un error y la decisión NO queda guardada.
  function leerRespuesta(resp){
    return resp.text().then(function(txt){
      var t = String(txt || '').trim();
      try { return JSON.parse(t); }
      catch(e){
        var pista;
        if(t.indexOf('solo POST') !== -1){
          pista = 'la petición llegó al servidor como GET y no como POST. '
                + 'Es el despliegue de Apps Script: tiene que estar publicado '
                + 'con acceso «Cualquiera» (TABLERO-LEEME.md, Paso 3)';
        } else if(t.charAt(0) === '<'){
          pista = 'el servidor devolvió una página web y no datos (HTTP '
                + resp.status + '). Lo más probable: el despliegue exige '
                + 'iniciar sesión en Google, y esta página no tiene sesión';
        } else {
          pista = 'el servidor contestó algo que no son datos (HTTP '
                + resp.status + '): ' + t.slice(0, 120);
        }
        throw new Error('no se guardó — ' + pista);
      }
    });
  }
  function firmarYEnviar(cuerpo, mensajeCanon){
    if(!URL_ESCRITURA) return Promise.reject(new Error('tablero: esta compilación no tiene URL de escritura'));
    if(!_hmacKey) return Promise.reject(new Error('tablero: todavía no se descifró la sesión'));
    return TABLERO_CRIPTO.firmar(_hmacKey, mensajeCanon).then(function(firma){
      cuerpo.firma = firma;
      // text/plain a propósito: application/json dispara un preflight CORS
      // que Apps Script no contesta, y el fetch nunca llega a salir.
      return fetch(URL_ESCRITURA, {
        method: 'POST',
        headers: {'Content-Type': 'text/plain;charset=utf-8'},
        body: JSON.stringify(cuerpo)
      });
    }).then(leerRespuesta)
      .then(function(r){
        if(!r || !r.ok) throw new Error((r && r.motivo) || 'el otro lado rechazó la escritura');
        return r;
      });
  }
  window.TABLERO={
    modo: MODO,
    descifrar: function(clave){
      return TABLERO_CRIPTO.descifrar(clave, window.__CARGA).then(function(r){
        _hmacKey = r.hmacKey;
        return r.estado;
      });
    },
    escribir: function(decision){
      var msg = canon([decision.id, decision.accion, decision.anotacion,
        decision.quien, decision.cuando, decision.idempotencia]);
      return firmarYEnviar({ruta:'escribir', id:decision.id, accion:decision.accion,
        anotacion:decision.anotacion, quien:decision.quien, cuando:decision.cuando,
        idempotencia:decision.idempotencia}, msg);
    },
    deshacer: function(id, idempotencia){
      var msg = canon([id, 'deshacer', idempotencia]);
      return firmarYEnviar({ruta:'deshacer', id:id, idempotencia:idempotencia}, msg);
    }
  };
})();

'use strict';
window.__err=[];window.addEventListener('error',function(e){window.__err.push(String(e.message))});
(function(){
var RM=window.matchMedia('(prefers-reduced-motion: reduce)');
var $=function(s,r){return (r||document).querySelector(s)};

/* ── ARRANCAR. Lo que antes era `hidden` en el HTML servido ahora NO EXISTE
   hasta acá: la hoja, el cuerpo y el guion del tablero llegan dentro del
   bloque cifrado y se montan en este orden —estilos, cuerpo, guion— porque el
   guion mide cajas apenas arranca y necesita el CSS ya aplicado. ── */
function arrancar(dat){
  var ui = dat && dat.ui;
  if(!ui || !ui.cuerpo || !ui.guion){
    /* Una carga del formato anterior descifra bien y no trae nada que pintar.
       Callarlo dejaría una pantalla en blanco que parece un fallo de clave y
       no lo es. El aviso no cuenta qué hay dentro: cuenta qué hacer. */
    $('.puerta-aviso').textContent =
      'Este documento se cifró con una versión anterior. Vuelve a cifrarlo: '
      + 'doble clic en «Estado - poner la clave».';
    document.getElementById('puerta').classList.add('mal');
    return false;
  }
  var st=document.createElement('style');
  st.textContent=ui.estilos||'';
  document.head.appendChild(st);
  document.querySelector('.site-foot').insertAdjacentHTML('beforebegin', ui.cuerpo);
  var sc=document.createElement('script');
  sc.textContent=ui.guion;
  document.body.appendChild(sc);
  if(!window.__montar){ return false; }
  window.__montar(dat);
  return true;
}

var pu=$('#puerta'), inp=$('#clave'), bot=$('#entrar'), abriendo=false;
// UN SOLO ENLACE, UNA SOLA CLAVE (6-sep-2026). Esta cadena tiene que ser
// idéntica a la que usa `/estado/` — la arma `enganche_sesion.py` para las
// dos, no se escribe a mano en dos lugares. Ver ese archivo para el porqué
// de sessionStorage y qué expone.
var LLAVE_SESION="compai_intranet_clave";
function entrar(){
  /* La puerta NO compara una clave: le pasa lo escrito a `descifrar` y espera
     una promesa. Eso ya valía para el sustituto de demostración y vale igual
     para WebCrypto, que es lo que va a haber; aquí no cambia una línea.
     Lo que sí cambia con cifrado de verdad es el TIEMPO: derivar una clave
     tarda a propósito, y sin acusarlo la puerta parece colgada. */
  if(abriendo) return;
  abriendo=true; pu.classList.add('abriendo');
  bot.disabled=true; inp.readOnly=true;
  var v=inp.value, t0=Date.now();
  var p=(window.TABLERO&&TABLERO.descifrar)?TABLERO.descifrar(v)
        :(window.__DEMO?window.__DEMO(v):Promise.reject('sin carga'));
  /* Suelo de 260 ms para las DOS salidas. Por dos motivos: en demostración la
     promesa resuelve en el acto y el aviso parpadearía, y con la clave mala el
     tiempo de respuesta deja de contar nada sobre por qué falló. */
  var suelo=function(f){return function(x){
    setTimeout(function(){f(x)}, Math.max(0, 260-(Date.now()-t0)))}};
  Promise.resolve(p).then(suelo(function(dat){
    /* La portada se SACA del documento antes de pintar —no se esconde—, igual
       que en `/estado/`: nada de la pantalla de clave queda debajo. */
    if(RM.matches){pu.remove(); arrancar(dat); return}
    pu.animate([{opacity:1,transform:'none'},{opacity:0,transform:'scale(.985)'}],
      {duration:220,easing:'cubic-bezier(.7,0,.84,0)',fill:'forwards'}).onfinish=function(){
        pu.remove(); arrancar(dat)};
  }),suelo(function(e){
    abriendo=false; pu.classList.remove('abriendo');
    bot.disabled=false; inp.readOnly=false;
    /* Si la clave venía de `/estado/` y no sirvió (llave vieja, la clave
       cambió y solo se recifró un lado), no tiene sentido dejarla guardada
       para que el próximo intento vuelva a fallar solo, en silencio, en cada
       recarga. Se borra y la puerta queda pidiendo la clave a mano, igual
       que si nunca hubiera pasado por `/estado/`. */
    try{ sessionStorage.removeItem(LLAVE_SESION); }catch(_e){}
    /* Que el aviso no MIENTA: si no hay carga que descifrar, el problema no es
       la clave, es el archivo, y decir «no es esa clave» manda a probar claves
       durante media hora. Solo pasa si falta la capa: una clave equivocada
       nunca llega por aquí, así que no filtra nada. */
    $('.puerta-aviso').textContent = (e==='sin carga')
      ? 'Este documento no trae su carga cifrada. No es la clave: es el archivo.'
      : 'No es esa clave.';
    pu.classList.add('mal');
    var c=$('.puerta-caja'); c.classList.remove('sacude'); void c.offsetWidth;
    c.classList.add('sacude'); inp.select();
    setTimeout(function(){pu.classList.remove('mal')},2600);
  }));
}
$('#entrar').addEventListener('click',entrar);
inp.addEventListener('keydown',function(e){if(e.key==='Enter')entrar()});
/* AUTO-ENTRADA: si `/estado/` ya dejó la clave en esta misma pestaña, se
   abre sola — nadie vuelve a escribirla. Usa la MISMA `entrar()` que el
   clic (nada de un segundo camino de "clave buena"); si falla, el catch de
   arriba ya deja la puerta como si el intento automático nunca hubiera
   pasado. Si no hay nada guardado (se llegó directo a esta URL, o la
   pestaña es nueva), no pasa nada y la puerta queda como siempre. */
(function(){
  var v; try{ v=sessionStorage.getItem(LLAVE_SESION); }catch(_e){ v=null; }
  if(v){ inp.value=v; entrar(); }
})();
})();

</script>

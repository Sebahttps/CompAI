:root{--ink:#2B2630;--ink2:#54595F;--ink3:#6B6469;--line:#DDD7D6;--bg:#F6F4F3;--card:#fff;--vino:#5A082F;--pri:#AC115B;--pri2:#5A082F;--ok:#0F7573;--warn:#8A5A00;--amb:#F8AC1A;--bad:#A4261D;--soft:#F7E9F0}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14.5px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
h1,h2,.top b,.lgt,.kpi b,.hero h1{font-family:Montserrat,"Segoe UI",system-ui,Arial,sans-serif}
a{color:var(--pri);}
.demo{background:#2B2630;color:#fff;font-size:12px;padding:5px 14px;text-align:center;letter-spacing:.02em}
.top{background:var(--vino);color:#fff;display:flex;gap:14px;align-items:center;padding:8px 16px;flex-wrap:wrap;border-bottom:3px solid var(--pri)}
.top .lg img{height:46px;display:block}.top .tt{display:flex;flex-direction:column;line-height:1.2;padding-left:14px;border-left:1px solid #ffffff55}
.qg{flex:0 1 300px;margin-left:10px}.qg input{background:#ffffff1f;border:1px solid #ffffff55;color:#fff;padding:6px 10px}.qg input::placeholder{color:#ffffffc9}.qg input:focus{background:#fff;color:var(--ink)}
.top b{font-size:15.5px}.top .sp{flex:1}.top small{opacity:.85}
.top button{background:transparent;color:#fff;border:1px solid #ffffff70;padding:4px 10px;border-radius:5px;cursor:pointer;font:inherit;font-size:13px}
.lay{display:flex;min-height:calc(100vh - 80px)}
nav.m{width:208px;background:#fff;border-right:1px solid var(--line);padding:10px 8px;flex:none}
nav.m .ng{display:block;font:700 10.5px Montserrat,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);padding:12px 10px 4px}nav.m .ng:first-child{padding-top:2px}
nav.m a{display:block;padding:7px 10px;border-radius:6px;text-decoration:none;color:var(--ink);margin-bottom:1px;border-left:3px solid transparent}
nav.m a.on{background:var(--soft);color:var(--pri2);font-weight:600;border-left-color:var(--pri)}nav.m a:hover{background:#F3EEEF}
main{flex:1;padding:18px 20px 60px;min-width:0;max-width:1180px}
h1{font-size:22px;font-weight:700;color:var(--vino);margin:0 0 12px}h2{font-size:15px;font-weight:700;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px}.kpi b{display:block;font-size:24px;color:var(--pri2)}.kpi span{color:var(--ink2);font-size:13px}
.kpi.w b{color:var(--warn)}.kpi.r b{color:var(--bad)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13.5px}th{text-align:left;color:var(--ink2);font-weight:600;border-bottom:2px solid var(--line);padding:6px 8px;white-space:nowrap}td{border-bottom:1px solid #e9eeef;padding:6px 8px;vertical-align:top}
label{display:block;font-size:12.5px;color:var(--ink2);margin:0 0 3px;font-weight:600}
input,select,textarea{width:100%;padding:8px 9px;border:1px solid #B5ABAE;border-radius:6px;font:inherit;background:#fff;color:var(--ink)}
textarea{min-height:58px}input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);outline-offset:0;border-color:var(--pri)}a:focus-visible,button:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px 14px}.f .w2{grid-column:1/-1}
.btn{background:var(--pri);color:#fff;border:0;padding:8px 13px;border-radius:6px;cursor:pointer;font:inherit;font-weight:600;font-size:13.5px;display:inline-block;text-decoration:none}
.btn:hover{background:var(--pri2)}.btn.s{background:#fff;color:var(--pri2);border:1px solid #B7A3AC}.btn.s:hover{background:var(--soft)}.btn.d{background:var(--bad)}.btn.sm{padding:4px 9px;font-size:12.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

function hex(b){ return Array.from(b).map(v=>v.toString(16).padStart(2,'0')).join(''); }

function sha256(input){

      const t2=((rr(a,2)^rr(a,13)^rr(a,22))+((a&b)^(a&c)^(b&c)))|0;
      hh=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;
    }
    h=[(h[0]+a)|0,(h[1]+b)|0,(h[2]+c)|0,(h[3]+d)|0,(h[4]+e)|0,(h[5]+f)|0,(h[6]+g)|0,(h[7]+hh)|0];
  }
  return h.map(v=>(v>>>0).toString(16).padStart(8,'0')).join('');
}

function sha1(m){
  const l=m.length,n=((l+9+63)>>>6)<<6,p=new Uint8Array(n);p.set(m);p[l]=0x80;
  const dv=new DataView(p.buffer);dv.setUint32(n-8,Math.floor(l/0x20000000));dv.setUint32(n-4,(l<<3)>>>0);
  let h=[0x67452301,0xEFCDAB89,0x98BADCFE,0x10325476,0xC3D2E1F0];const rl=(x,k)=>(x<<k)|(x>>>(32-k));const w=new Int32Array(80);
  for(let o=0;o<n;o+=64){
    for(let i=0;i<16;i++)w[i]=dv.getInt32(o+i*4);
    for(let i=16;i<80;i++)w[i]=rl(w[i-3]^w[i-8]^w[i-14]^w[i-16],1);
    let [a,b,c,d,e]=h;
    for(let i=0;i<80;i++){
      const f=i<20?((b&c)|(~b&d))+0x5A827999:i<40?(b^c^d)+0x6ED9EBA1:i<60?((b&c)|(b&d)|(c&d))+0x8F1BBCDC:(b^c^d)+0xCA62C1D6;
      const t=(rl(a,5)+f+e+w[i])|0;e=d;d=c;c=rl(b,30);b=a;a=t;
    }
    h=[(h[0]+a)|0,(h[1]+b)|0,(h[2]+c)|0,(h[3]+d)|0,(h[4]+e)|0];
  }
  const r=new Uint8Array(20),d2=new DataView(r.buffer);h.forEach((v,i)=>d2.setInt32(i*4,v));return r;
}
function totp(secret,t){
  let key=toBytes(secret);if(key.length>64)key=sha1(key);const ip=new Uint8Array(64).fill(0x36),op=new Uint8Array(64).fill(0x5c);key.forEach((b,i)=>{ip[i]^=b;op[i]^=b;});
  const c=Math.floor((t||Date.now())/30000),msg=new Uint8Array(8);new DataView(msg.buffer).setUint32(4,c);
  const a=new Uint8Array(72);a.set(ip);a.set(msg,64);const ih=sha1(a),b=new Uint8Array(84);b.set(op);b.set(ih,64);const hm=sha1(b);
  const of=hm[19]&15,v=(new DataView(hm.buffer).getUint32(of)&0x7fffffff)%1000000;return String(v).padStart(6,'0');
}

/* ----- QR (modo byte, corrección M) ----- */
const QR=(function(){

  const BLK=[-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49];
  function rawMods(v){let r=(16*v+128)*v+64;if(v>=2){const n=Math.floor(v/7)+2;r-=(25*n-10)*n-55;if(v>=7)r-=36;}return r;}
  const dataCW=v=>Math.floor(rawMods(v)/8)-ECC[v]*BLK[v];
  function gm(a,b){let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((b>>>i)&1)*a;}return z&255;}
  function rsDiv(deg){const r=new Array(deg).fill(0);r[deg-1]=1;let root=1;for(let i=0;i<deg;i++){for(let j=0;j<deg;j++){r[j]=gm(r[j],root);if(j+1<deg)r[j]^=r[j+1];}root=gm(root,2);}return r;}
  function rsRem(d,div){const r=div.map(()=>0);for(const b of d){const f=b^r.shift();r.push(0);div.forEach((c,i)=>{r[i]^=gm(c,f);});}return r;}
  function align(v){if(v===1)return[];const n=Math.floor(v/7)+2,st=v===32?26:Math.ceil((v*4+4)/(n*2-2))*2,res=[6];for(let p=v*4+10;res.length<n;p-=st)res.splice(1,0,p);return res;}
  function encode(text){
    const data=Array.from(toBytes(text));let v=1;
    for(;v<=40;v++){const cb=v<10?8:16;if(4+cb+data.length*8<=dataCW(v)*8)break;}
    if(v>40)throw new Error('QR: texto demasiado largo');
    const bits=[];const put=(val,n)=>{for(let i=n-1;i>=0;i--)bits.push((val>>>i)&1);};
    put(4,4);put(data.length,v<10?8:16);data.forEach(b=>put(b,8));
    const cap=dataCW(v)*8;put(0,Math.min(4,cap-bits.length));put(0,(8-bits.length%8)%8);
    for(let p=0xEC;bits.length<cap;p^=0xEC^0x11)put(p,8);
    const dc=[];for(let i=0;i<bits.length;i+=8){let x=0;for(let j=0;j<8;j++)x=(x<<1)|bits[i+j];dc.push(x);}
    /* bloques */
    const nb=BLK[v],ec=ECC[v],raw=Math.floor(rawMods(v)/8),ns=nb-raw%nb,sl=Math.floor(raw/nb),div=rsDiv(ec),blocks=[];
    for(let i=0,k=0;i<nb;i++){const d=dc.slice(k,k+sl-ec+(i<ns?0:1));k+=d.length;const e=rsRem(d,div);if(i<ns)d.push(0);blocks.push(d.concat(e));}
    const all=[];for(let i=0;i<blocks[0].length;i++)blocks.forEach((b,j)=>{if(i!==sl-ec||j>=ns)all.push(b[i]);});
    /* matriz */
    const size=v*4+17,M=[],F=[];for(let i=0;i<size;i++){M.push(new Array(size).fill(false));F.push(new Array(size).fill(false));}
    const setF=(x,y,d)=>{M[y][x]=d;F[y][x]=true;};
    for(let i=0;i<size;i++){setF(6,i,i%2===0);setF(i,6,i%2===0);}
    const finder=(cx,cy)=>{for(let d=-4;d<=4;d++)for(let e=-4;e<=4;e++){const r=Math.max(Math.abs(e),Math.abs(d)),x=cx+e,y=cy+d;if(x>=0&&x<size&&y>=0&&y<size)setF(x,y,r!==2&&r!==4);}};
    finder(3,3);finder(size-4,3);finder(3,size-4);
    const al=align(v);al.forEach((a,i)=>al.forEach((b,j)=>{if(!((i===0&&j===0)||(i===0&&j===al.length-1)||(i===al.length-1&&j===0)))for(let d=-2;d<=2;d++)for(let e=-2;e<=2;e++)setF(a+e,b+d,Math.max(Math.abs(e),Math.abs(d))!==1);}));
    const fmt=(mask)=>{const d=(0<<3)|mask;let r=d;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);const b=((d<<10)|r)^0x5412;const g=i=>((b>>>i)&1)!==0;
      for(let i=0;i<=5;i++)setF(8,i,g(i));setF(8,7,g(6));setF(8,8,g(7));setF(7,8,g(8));for(let i=9;i<15;i++)setF(14-i,8,g(i));
      for(let i=0;i<8;i++)setF(size-1-i,8,g(i));for(let i=8;i<15;i++)setF(8,size-15+i,g(i));setF(8,size-8,true);};
    fmt(0);
    if(v>=7){let r=v;for(let i=0;i<12;i++)r=(r<<1)^((r>>>11)*0x1F25);const b=(v<<12)|r;for(let i=0;i<18;i++){const c=((b>>>i)&1)!==0,a=size-11+i%3,bb=Math.floor(i/3);setF(a,bb,c);setF(bb,a,c);}}
    let i=0;for(let right=size-1;right>=1;right-=2){if(right===6)right=5;for(let vert=0;vert<size;vert++)for(let j=0;j<2;j++){const x=right-j,up=((right+1)&2)===0,y=up?size-1-vert:vert;if(!F[y][x]&&i<all.length*8){M[y][x]=((all[i>>>3]>>>(7-(i&7)))&1)!==0;i++;}}}
    const applyMask=m=>{for(let y=0;y<size;y++)for(let x=0;x<size;x++){let inv;switch(m){case 0:inv=(x+y)%2===0;break;case 1:inv=y%2===0;break;case 2:inv=x%3===0;break;case 3:inv=(x+y)%3===0;break;case 4:inv=(Math.floor(x/3)+Math.floor(y/2))%2===0;break;case 5:inv=x*y%2+x*y%3===0;break;case 6:inv=(x*y%2+x*y%3)%2===0;break;default:inv=((x+y)%2+x*y%3)%2===0;}if(!F[y][x]&&inv)M[y][x]=!M[y][x];}};
    const penalty=()=>{let s=0;const line=get=>{let run=1;for(let k=1;k<size;k++){if(get(k)===get(k-1)){run++;if(run===5)s+=3;else if(run>5)s++;}else run=1;}
        let w=0;for(let k=0;k<size;k++){w=((w<<1)&0x7ff)|(get(k)?1:0);if(k>=10&&(w===0x5D0||w===0x05D))s+=40;}};
      for(let y=0;y<size;y++)line(k=>M[y][k]);for(let x=0;x<size;x++)line(k=>M[k][x]);
      let dark=0;for(let y=0;y<size;y++)for(let x=0;x<size;x++){if(M[y][x])dark++;if(y<size-1&&x<size-1&&M[y][x]===M[y][x+1]&&M[y][x]===M[y+1][x]&&M[y][x]===M[y+1][x+1])s+=3;}
      s+=Math.floor(Math.abs(dark*20-size*size*10)/(size*size))*10;return s;};
    let best=0,min=Infinity;for(let m=0;m<8;m++){applyMask(m);fmt(m);const p=penalty();if(p<min){min=p;best=m;}applyMask(m);}
    applyMask(best);fmt(best);
    return {size,M,version:v};
  }
  return {encode};
})();
function qrCanvas(text,scale){
  const q=QR.encode(text),q0=4,sc=scale||4,c=document.createElement('canvas');c.width=c.height=(q.size+q0*2)*sc;
  const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.fillStyle='#000';
  for(let y=0;y<q.size;y++)for(let x=0;x<q.size;x++)if(q.M[y][x])g.fillRect((x+q0)*sc,(y+q0)*sc,sc,sc);
  return c;
}

/* ----- PDF mínimo, determinista, sin dependencias ----- */
function winansi(s){
  const map={'€':128,'‚':130,'“':147,'”':148,'–':150,'—':151,'·':183};
  const out=[];for(const ch of String(s)){const c=ch.codePointAt(0);if(map[ch])out.push(map[ch]);else if(c<256)out.push(c);else out.push(63);}
  return out;
}
function pdfStr(s){return '('+winansi(s).map(c=>{if(c===40||c===41||c===92)return'\\'+String.fromCharCode(c);if(c<32||c>126)return'\\'+c.toString(8).padStart(3,'0');return String.fromCharCode(c);}).join('')+')';}
function hlvW(s,sz){return winansi(s).length*sz*0.5;}
function wrapTxt(s,sz,w){const o=[];let l='';for(const p of String(s).split(' ')){if(hlvW(l+' '+p,sz)>w&&l){o.push(l);l=p;}else l=l?l+' '+p:p;}if(l)o.push(l);return o;}
function buildPDF(ops,meta){
  /* ops: contenido ya formateado en operadores PDF */
  const objs=[];
  objs[1]='<< /Type /Catalog /Pages 2 0 R >>';
  objs[2]='<< /Type /Pages /Kids [3 0 R] /Count 1 >>';
  objs[3]='<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 5 0 R /F2 6 0 R >> /ExtGState << /G1 << /ca 0.13 >> >>'+(meta.img?' /XObject << /Im1 8 0 R >>':'')+' >> /Contents 4 0 R >>';
  const stream=ops.join('\n');
  objs[4]='<< /Length '+winansi(stream).length+' >>\nstream\n'+stream+'\nendstream';
  objs[5]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
  objs[6]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
  objs[7]='<< /Title '+pdfStr(meta.title||'')+' /Author '+pdfStr(meta.author||'')+' /CreationDate (D:'+(meta.date||'20260101000000')+'-03\'00\') >>';
  if(meta.img)objs[8]='<< /Type /XObject /Subtype /Image /Width '+meta.img.w+' /Height '+meta.img.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter [/ASCIIHexDecode /DCTDecode] /Length '+(meta.img.hex.length+1)+' >>\nstream\n'+meta.img.hex+'>\nendstream';
  let b='%PDF-1.4\n';const off=[];
  for(let i=1;i<objs.length;i++){off[i]=b.length;b+=i+' 0 obj\n'+objs[i]+'\nendobj\n';}
  const x=b.length;b+='xref\n0 '+objs.length+'\n0000000000 65535 f \n';
  for(let i=1;i<objs.length;i++)b+=String(off[i]).padStart(10,'0')+' 00000 n \n';
  b+='trailer\n<< /Size '+objs.length+' /Root 1 0 R /Info 7 0 R >>\nstartxref\n'+x+'\n%%EOF\n';
  return Uint8Array.from(winansi(b));
}

/* ----- ZIP (almacenado, sin compresión) y XLSX ----- */
const crcT=(()=>{const t=new Int32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c;}return t;})();
function crc32(b){let c=-1;for(let i=0;i<b.length;i++)c=crcT[(c^b[i])&255]^(c>>>8);return(c^-1)>>>0;}
function zipStore(files){
  const parts=[],cd=[];let off=0;
  const u16=v=>[v&255,(v>>>8)&255],u32=v=>[v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255];
  for(const f of files){
    const n=enc.encode(f.name),d=toBytes(f.data),c=crc32(d);
    const head=[0x50,0x4b,3,4,...u16(20),...u16(0x800),...u16(0),...u16(0),...u16(0x21),...u32(c),...u32(d.length),...u32(d.length),...u16(n.length),...u16(0)];
    parts.push(Uint8Array.from(head),n,d);
    cd.push({n,c,len:d.length,off});off+=head.length+n.length+d.length;
  }
  const start=off;let cs=0;
  for(const e of cd){const h=[0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x800),...u16(0),...u16(0),...u16(0x21),...u32(e.c),...u32(e.len),...u32(e.len),...u16(e.n.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(e.off)];parts.push(Uint8Array.from(h),e.n);cs+=h.length+e.n.length;}
  parts.push(Uint8Array.from([0x50,0x4b,5,6,0,0,0,0,...u16(cd.length),...u16(cd.length),...u32(cs),...u32(start),0,0]));
  return new Blob(parts,{type:'application/zip'});
}
function xmlEsc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function xlsx(rows,hoja){
  const col=i=>String.fromCharCode(65+i);
  const sheet='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>'+rows.map((r,y)=>'<row r="'+(y+1)+'">'+r.map((v,x)=>'<c r="'+col(x)+(y+1)+'" t="inlineStr"><is><t>'+xmlEsc(v)+'</t></is></c>').join('')+'</row>').join('')+'</sheetData></worksheet>';
  return zipStore([
    {name:'[Content_Types].xml',data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>'},
    {name:'_rels/.rels',data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
    {name:'xl/workbook.xml',data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="'+xmlEsc(hoja||'Hoja1')+'" sheetId="1" r:id="rId1"/></sheets></workbook>'},
    {name:'xl/_rels/workbook.xml.rels',data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>'},
    {name:'xl/worksheets/sheet1.xml',data:sheet}

function buscar(q0){
  const q=norm(q0),out=[];if(!q)return out;const dig=/^[0-9][0-9.\-kK]*$/.test(q0.trim());
  if(!dig&&q.length<3)return out;const toks=q.split(/\s+/);
  const pasa=(cem,tp,est,ff)=>(!qSt.cem||cem===qSt.cem)&&(!qSt.tipo||tp===qSt.tipo)&&(!qSt.est||est===qSt.est)&&(!qSt.d||(ff&&ff>=qSt.d))&&(!qSt.h||(ff&&ff<=qSt.h));
  for(const i of S.inh){if(i.anulado)continue;const u=S.ubic.find(x=>x.id===i.ubic);const tx=norm([i.nom,i.ap,i.am].join(' '));let ok=toks.every(t=>tx.includes(t));
    if(!ok&&dig)ok=normRut(i.rut).includes(normRut(q0));
    if(ok&&pasa(u?sector(u.sec).cem:'',u?u.tipo:'',i.estado,i.ffal))out.push({k:'f',i,u,peso:tx.startsWith(toks[0])?0:1});}
  if(dig&&/^\d+(\.\d+)?$/.test(q0.trim())){for(const u of S.ubic)if(String(u.num).startsWith(q0.trim())&&pasa(sector(u.sec).cem,u.tipo,'',null))out.push({k:'u',u,peso:String(u.num)===q0.trim()?-1:2});}

}

function zonaAdj(id){return '<div><label>Adjunto (PDF, JPG o PNG, hasta 10 MB)</label><input type="file" id="'+id+'" accept=".pdf,.jpg,.jpeg,.png"><div class="row" style="margin-top:5px"><button type="button" class="btn s sm" data-a="adj-ej" data-t="'+id+'">Usar PDF de ejemplo</button><span id="'+id+'-n" style="font-size:12.5px;color:var(--ink2)"></span></div></div>';}
const adjTemp={};
function leerAdj(id){return new Promise((ok,no)=>{if(adjTemp[id])return ok(adjTemp[id]);const f=$('#'+id).files[0];if(!f)return ok(null);
  if(!/\.(pdf|jpe?g|png)$/i.test(f.name))return no('Tipo de archivo rechazado: solo PDF, JPG y PNG.');if(f.size>10*1024*1024)return no('Archivo rechazado: supera 10 MB.');
  const r=new FileReader();r.onload=()=>ok({nombre:f.name,tipo:f.type||'application/octet-stream',data:r.result.split(',')[1]});r.readAsDataURL(f);});}
function guardaAdj(reg,a){if(!a)return null;const id='ADJ-'+(S.adj.length+1);S.adj.push(Object.assign({id,reg},a));return id;}

/* ---- Inhumación ---- */
function vInhumar(a){
  const dispo=S.ubic.filter(u=>estadoU(u)==='disponible'||a===u.id);
  marco('inhumar','<h1>Registro de inhumación</h1><div class="card"><div id="ferr"></div><form id="fi"><label class="chk"><input type="checkbox" id="inn"> Persona no identificada (NN): sin nombre ni RUT. Se registra y se conserva como tal</label><div class="f"><div><label>Nombres *</label><input id="in" required></div><div><label>Apellido paterno *</label><input id="ip" required></div><div><label>Apellido materno</label><input id="im"></div><div><label>RUT del fallecido * (revisa dígito verificador)</label><input id="ir" placeholder="12345678-5" required></div><div><label>Edad</label><input id="ie" inputmode="numeric"></div><div><label>Causa de muerte (no visible para perfil Consulta)</label><input id="ic"></div><div><label>Fecha de nacimiento</label><input type="date" id="ifn"></div><div><label>Fecha de fallecimiento *</label><input type="date" id="iff" required></div><div class="w2"><label>Lugar donde será sepultado *</label><select id="iu" required><option value="">Elegir…</option>'+dispo.map(u=>'<option value="'+u.id+'"'+(a===u.id?' selected':'')+'>'+esc(ubicTxt(u.id))+'</option>').join('')+'</select></div><div><label>Responsable: nombre completo *</label><input id="rn" required></div><div><label>Responsable: RUT</label><input id="rr"></div><div><label>Responsable: dirección</label><input id="rd"></div><div><label>Responsable: teléfono</label><input id="rt"></div>'+zonaAdj('ipase').replace('Adjunto (','Pase de sepultación * (')+zonaAdj('iord').replace('Adjunto (','Orden de ingreso (')+'<div class="w2"><label>Observaciones</label><textarea id="io"></textarea></div></div><div style="margin-top:12px"><button class="btn" id="gi">Guardar inhumación</button></div></form></div>');
  $('#inn').onchange=e=>{const nn=e.target.checked;['#in','#ip','#ir'].forEach(k=>{$(k).required=!nn;$(k).disabled=nn;if(nn)$(k).value='';});};
  $('#fi').onsubmit=async e=>{e.preventDefault();const nn=$('#inn').checked;const err=t=>{$('#ferr').innerHTML='<div class="msg e" id="errmsg">'+esc(t)+'</div>';window.scrollTo(0,0);};
    const r=$('#ir').value.trim();if(!nn&&!rutValido(r)){log('Inhumaciones','','creación',[{campo:'RUT',antes:'',despues:r}],'fallido');return err('RUT rechazado: el dígito verificador no corresponde.');}
    let pase,ord;try{pase=await leerAdj('ipase');ord=await leerAdj('iord');}catch(x){log('Adjuntos','','carga de adjunto',[],'fallido');return err(x);}
    if(S.cfgAdj.inhumacion&&!pase)return err('Debe adjuntar el pase de sepultación (adjunto configurado como obligatorio).');
    S.nIng++;const id=String(S.nIng);const i={id,nom:nn?'NN':$('#in').value.toUpperCase(),ap:nn?'':$('#ip').value.toUpperCase(),am:nn?'':$('#im').value.toUpperCase(),rut:nn?'':rutFmt(r),sexo:'',edad:$('#ie').value,fnac:$('#ifn').value,ffal:$('#iff').value,fsep:hoy(),causa:$('#ic').value,ubic:$('#iu').value,estado:'inhumado',marca:'nuevo',fila_origen:'',resp:{nombre:$('#rn').value,rut:$('#rr').value,dir:$('#rd').value,fono:$('#rt').value},obs:$('#io').value,anulado:null,adj:[],mov:[]};
    [pase,ord].forEach(x=>{const k=guardaAdj(id,x);if(k){i.adj.push(k);log('Adjuntos',id,'carga de adjunto',[{campo:'archivo',antes:'',despues:x.nombre}]);}});delete adjTemp.ipase;delete adjTemp.iord;
    S.inh.push(i);log('Inhumaciones',id,'creación',[{campo:'fallecido',antes:'',despues:nomCompl(i)},{campo:'ubicación',antes:'',despues:i.ubic}]);msg('Inhumación registrada con N° de ingreso '+id+'.');location.hash='#/fallecido/'+id;};
}

/* ---- Certificados ---- */
function opcionesCert(t){
  if(t==='INH')return S.inh.filter(i=>!i.anulado).map(i=>[i.id,nomCompl(i)+' · ingreso '+i.id]);
  const f={SEP:u=>u.tipo==='sepultura',BOV:u=>u.tipo==='boveda',MAU:u=>u.tipo==='mausoleo',ARR:u=>(u.tipo==='nicho'||u.tipo==='fosa'),NPE:u=>u.tipo==='nicho'}[t];
  return S.prop.filter(p=>{const u=S.ubic.find(x=>x.id===p.ubic);return u&&f(u)&&(t==='ARR'?p.periodo!=='PERPETUO':t==='NPE'?p.periodo==='PERPETUO':true);}).map(p=>[p.id,nomCompl(p)+' · '+ubicTxt(p.ubic)]);
}
function vCerts(tp,ref){
  const t=tp||'INH';const ops=opcionesCert(t);
  const r0=ref&&ops.some(o=>o[0]===ref)?ref:(ops[0]?ops[0][0]:'');
  marco('certs','<h1>Certificados</h1>'+pasosCert(3)+'<div class="card"><div class="f"><div><label>Tipo de certificado</label><select id="ct">'+Object.keys(TIPOC).map(k=>'<option value="'+k+'"'+(k===t?' selected':'')+'>'+TIPOC[k]+'</option>').join('')+'</select></div><div class="w2"><label>Registro</label><select id="cr">'+ops.map(o=>'<option value="'+o[0]+'"'+(o[0]===ref?' selected':'')+'>'+esc(o[1])+'</option>').join('')+'</select></div></div><div class="prev" id="prev">'+prevCert(t,r0)+'</div><div style="margin-top:12px"><button class="btn" data-a="emitir" id="bem">Emitir certificado</button></div></div><div class="card tw"><h2 style="margin-top:0">Emitidos</h2><table><tr><th>Folio</th><th>Tipo</th><th>Emisión</th><th>Estado</th><th></th></tr>'+S.certs.slice().reverse().map(c=>'<tr><td class="mono">'+esc(c.folio)+'</td><td>'+esc(c.titulo)+'</td><td>'+esc(c.fecha)+'</td><td>'+tagEst(c.estado)+'</td><td><a class="btn s sm" href="#/cert/'+esc(c.id)+'">Abrir</a></td></tr>').join('')+'</table></div>');
  $('#ct').onchange=e=>{location.hash='#/certs/'+e.target.value;};
  $('#cr').onchange=e=>{$('#prev').innerHTML=prevCert(t,e.target.value);};
}

function vistaVerif(code,pl,anul){
  S||cargar();
  let c=S.certs.find(x=>x.codigo===code),nota='';
  if(!c&&pl){try{const d=JSON.parse(ub64u(pl));if(Array.isArray(d)){c={tipo:d[0],folio:d[1],fecha:d[2],emisor:d[3],lineas:d[4].map((v,n)=>[lblCert(d[0])[n],v]),codigo:code,titulo:TIPOC[d[0]]||d[0],estado:'vigente',motivo:''};c.url=urlQR(c);c.sha=sha256(pdfCert(c));nota='<div class="msg i" style="margin-top:10px">Esta demostración no tiene servidor: el teléfono lee el certificado desde el código QR y calcula su huella. En la plataforma contratada el estado se consulta en la base central.</div>';}}catch(e){}}

function csv(rows){return '﻿'+rows.map(r=>r.map(v=>{const s=String(v==null?'':v);return /[",\n;]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(',')).join('\r\n')+'\r\n';}
function tablasSalida(){
  const t={};
  t.fallecidos=[['id_ingreso','nombres','apellido_paterno','apellido_materno','rut','fecha_nacimiento','fecha_fallecimiento','fecha_sepultacion','causa','id_ubicacion','estado','marca','origen','observaciones','anulado'],...S.inh.map(i=>[i.id,i.nom,i.ap,i.am,i.rut,i.fnac,i.ffal,i.fsep,i.causa,i.ubic,i.estado,i.marca,i.fila_origen,i.obs,i.anulado||''])];
  t.ubicaciones=[['id_ubicacion','tipo','codigo_sector','fila','numero','estado','origen'],...S.ubic.map(u=>[u.id,u.tipo,u.sec,u.fila,u.num,estadoU(u),u.origen])];
  t.sectores=[['codigo','clase','nombre','cementerio','rango_min','rango_max','filas','activo'],...S.sectores.map(s=>[s.cod,s.tipo,s.nombre,s.cem,s.min,s.max,s.filas,s.activo?'1':'0'])];
  t.propiedades=[['id_ingreso','id_ubicacion','nombres','apellido_paterno','apellido_materno','rut','direccion','telefono','periodo','fecha_orden','fecha_vencimiento','marca','origen'],...S.prop.map(p=>[p.id,p.ubic,p.nom,p.ap,p.am,p.rut,p.dir,p.fono,p.periodo,p.forden,p.fvenc,p.marca,p.fila_origen])];
  t.exhumaciones=[['id_ingreso','id_fallecido','desde','hacia','fecha','motivo','solicitante','resolucion','observaciones','marca'],...S.exh.map(e=>[e.id,e.inh,e.desde,e.hacia,e.fecha,e.motivo,e.sol,e.res,e.obs,e.marca])];
  t.trabajos=[['id_ingreso','id_ubicacion','tipo','maestro','fecha','observaciones','marca'],...S.trab.map(x=>[x.id,x.ubic,x.tipo,x.maestro,x.fecha,x.obs,x.marca])];
  t.transferencias=[['id_ubicacion','propietario_anterior','propietario_nuevo','fecha','documento','nota'],...S.transf.map(x=>[x.ubic,x.antes,x.nuevo,x.fecha,x.doc,x.nota||''])];
  t.verificacion_certificados=[['folio','tipo','fecha','codigo','huella_sha256','estado','motivo'],...S.certs.map(c=>[c.folio,c.tipo,c.fecha,c.codigo,c.sha,c.estado,c.motivo])];
  return t;
}
function sqlSalida(t){
  let s='-- Respaldo completo en SQL estandar, ejecutable en PostgreSQL. Datos ficticios de demostracion.\n';
  for(const k of Object.keys(t)){const c=t[k][0];s+='CREATE TABLE '+k+' ('+c.map(x=>x+' TEXT').join(', ')+');\n';
    for(const r of t[k].slice(1))s+='INSERT INTO '+k+' ('+c.join(', ')+') VALUES ('+r.map(v=>"'"+String(v==null?'':v).replace(/'/g,"''")+"'").join(', ')+');\n';}
  return s;
}
function generarSalida(){
  const t=tablasSalida(),fs=[];
  for(const k of Object.keys(t))fs.push({name:'csv/'+k+'.csv',data:csv(t[k])});
  fs.push({name:'sql/respaldo_completo.sql',data:sqlSalida(t)});
  const idx=[['archivo','id_registro','nombre_original']];
  S.adj.forEach(a=>{const n='adjuntos/'+a.reg+'/'+a.id+'-'+a.nombre;fs.push({name:n,data:unb64(a.data)});idx.push([n,a.reg,a.nombre]);});
  fs.push({name:'adjuntos/indice.csv',data:csv(idx)});
  S.certs.forEach(c=>fs.push({name:'certificados/'+c.folio+'.pdf',data:pdfCert(c)}));
  fs.push({name:'certificados/tabla_verificacion.csv',data:csv(t.verificacion_certificados)});
  fs.push({name:'auditoria/log.csv',data:csv([['seq','fecha_hora','usuario','rut','perfil','ip','modulo','registro','operacion','cambios','resultado','huella_anterior','huella'],...S.log.map(e=>[e.seq,e.ts,e.usuario,e.rut,e.perfil,e.ip,e.modulo,e.registro,e.op,JSON.stringify(e.cambios),e.resultado,e.prev,e.hash])])});
  fs.push({name:'configuracion/catalogos_usuarios_perfiles.json',data:JSON.stringify({periodos:S.periodos,tipos_exhumacion:S.tiposEx,usuarios:USERS.map(u=>({usuario:u.u,perfil:u.perfil})),adjuntos_obligatorios:S.cfgAdj},null,1)});
  fs.push({name:'configuracion/plantillas_certificados.json',data:JSON.stringify(TIPOC,null,1)});
  const man=fs.map(f=>sha256(toBytes(f.data))+'  '+f.name).join('\n')+'\n';
  fs.push({name:'manifiesto_sha256.txt',data:man});
  return {zip:zipStore(fs),n:fs.length,fs};
}

/* ---- Mapa y disponibilidad ---- */
function simEst(sec,num){let h=0;const t=sec+':'+num;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))>>>0;h=h%100;return h<66?'ocupado':h<69?'reservado':'disponible';}
function celdas(s){
  const min=Number(s.min),max=Number(s.max),out=[];const us=S.ubic.filter(u=>u.sec===s.cod);
  if(min>=0&&max>0&&max>=min){const n=Math.min(max-min+1,160),fl=Number(s.filas)||1,per=Math.ceil(n/fl);
    for(let k=0;k<n;k++){const num=String(min+k),u=us.find(x=>String(x.num)===num);out.push({num,u,est:u?estadoU(u):simEst(s.cod,num),fila:u?(Number(u.fila)||1):Math.floor(k/per)+1});}}
  us.filter(u=>!out.some(c=>c.num===String(u.num))).forEach(u=>out.push({num:String(u.num),u,est:estadoU(u),fila:Number(u.fila)||1}));
  return out;
}
let dtp='';const TPN={'Adulto':/ADULTO/,'Párvulo':/PARVUL/,'Restos y recién nacidos':/RESTO|R\.N|RECIEN/,'Sobre medida':/SOBRE MEDIDA/};
function vDisp(a){
  const cod=a||'R',s=sector(cod),cem=s.cem||'SC';const conU=new Set(S.ubic.map(u=>u.sec));
  const delCem=S.sectores.filter(x=>x.cod&&x.cem===cem&&x.activo!==false&&(!dtp||TPN[dtp].test(x.nombre)||x.cod===cod));const cards=delCem.filter(x=>conU.has(x.cod)).slice(0,12);
  const tabC=c=>{const p=S.sectores.find(x=>x.cem===c&&conU.has(x.cod));return '<a class="tab'+(cem===c?' on':'')+'" href="#/disp/'+(p?p.cod:cod)+'">'+CEMD[c].n+'</a>';};
  const cs=celdas(s);const cnt={disponible:0,ocupado:0,reservado:0};cs.forEach(c=>cnt[c.est]++);
  const prim=cs.find(c=>c.est==='disponible');const clase=s.tipo==='PAB'?'Pabellón':'Patio';
  const filas={};cs.forEach(c=>{(filas[c.fila]=filas[c.fila]||[]).push(c);});
  const celda=c=>{const t='N° '+c.num+' · fila '+c.fila+' · '+c.est;
    if(c.u)return '<a class="cell '+c.est[0]+'" href="#/ficha/'+c.u.id+'" data-tip="'+t+'">'+c.num+'</a>';
    if(c.est==='disponible'&&puede('registrar'))return '<a class="cell d" href="#" data-a="crear-ub" data-sec="'+esc(cod)+'" data-num="'+c.num+'" data-fila="'+c.fila+'" data-tip="'+t+'">'+c.num+'</a>';
    return '<a class="cell '+c.est[0]+'" href="#" data-a="cel-sim" data-num="'+c.num+'" data-fila="'+c.fila+'" data-est="'+c.est+'" data-tip="'+t+'">'+c.num+'</a>';};
  const grilla=Object.keys(filas).sort((x,y)=>x-y).map(f=>'<div class="fl"><span class="fln">Fila '+f+'</span><div class="flc">'+filas[f].sort((x,y)=>x.num-y.num).map(celda).join('')+'</div></div>').join('');
  const sc=x=>{const c=celdas(x);const o=c.filter(y=>y.est==='ocupado').length,d=c.filter(y=>y.est==='disponible').length,pc=c.length?Math.round(o/c.length*100):0;return '<a class="sec'+(x.cod===cod?' on':'')+'" href="#/disp/'+esc(x.cod)+'"><b>'+esc(x.nombre)+'</b><small>'+(x.tipo==='PAB'?'Pabellón':'Patio')+' '+esc(x.cod)+' · '+d+' disponibles</small><span class="bt"><i style="width:'+pc+'%"></i></span></a>';};
  const lista=S.ubic.filter(u=>u.sec===cod).map(u=>'<tr><td><a href="#/ficha/'+u.id+'">'+esc(u.num)+'</a></td><td>'+esc(u.fila)+'</td><td>'+esc(u.tipo)+'</td><td>'+tagEst(estadoU(u))+'</td></tr>').join('');
  marco('disp','<div class="hd"><div><h1>Mapa y disponibilidad</h1><p class="sub">Por cementerio, patio o pabellón, fila y número.</p></div><div class="tabs">'+tabC('SC')+tabC('CA')+'</div></div>'
  +'<div class="card"><div class="f"><div><label for="tpn">Tipo de nicho (según el nombre del pabellón)</label><select id="tpn"><option value="">Todos</option>'+Object.keys(TPN).map(k=>'<option'+(k===dtp?' selected':'')+'>'+k+'</option>').join('')+'</select></div><div><label for="sp">Patio o pabellón</label><select id="sp">'+delCem.map(x=>'<option value="'+esc(x.cod)+'"'+(x.cod===cod?' selected':'')+'>'+esc(x.nombre)+' ('+esc(x.cod)+')</option>').join('')+'</select></div><div><label for="nb">Buscar número (estado al instante)</label><input id="nb" placeholder="Número de sepultura o nicho" autocomplete="off"></div></div><div id="nr" style="margin-top:8px"></div></div>'
  +'<div class="secs">'+cards.map(sc).join('')+'</div>'
  +'<div class="card"><div class="hd" style="margin-bottom:8px"><div><h2 style="margin:0">'+(/^patio/i.test(s.nombre)?'':clase+' ')+esc(s.nombre)+'</h2><p class="sub">Código '+esc(cod)+(s.min?' · números '+esc(s.min)+' a '+esc(s.max):' · sin rango de numeración en el catálogo')+'</p></div>'+(prim&&puede('registrar')?(prim.u?'<a class="btn" id="bprim" href="#/ficha/'+prim.u.id+'">Primer disponible: N° '+prim.num+', fila '+prim.fila+'</a>':'<button class="btn" id="bprim" data-a="crear-ub" data-sec="'+esc(cod)+'" data-num="'+prim.num+'" data-fila="'+prim.fila+'">Primer disponible: N° '+prim.num+', fila '+prim.fila+'</button>'):'')+'</div>'
  +'<div class="ley"><span><i class="sd"></i>Disponible '+cnt.disponible+'</span><span><i class="so"></i>Ocupado '+cnt.ocupado+'</span><span><i class="sr"></i>Reservado '+cnt.reservado+'</span></div>'
  +(cs.length?'<div class="grl tw">'+grilla+'</div>':'<p>Este sector no tiene números en la muestra. Su rango se completa con el catálogo que entrega la Municipalidad.</p>')
  +'<div id="pn"></div><p class="sub" style="margin:10px 0 0">Solo las ubicaciones con ficha son registros de la muestra; los demás números tienen un estado simulado. '+(cs.length>=160?'Se muestran los primeros 160 números del rango.':'')+'</p></div>'
  +(lista?'<div class="card tw"><h2 style="margin-top:0">Con ficha en este sector</h2><table><tr><th>N°</th><th>Fila</th><th>Tipo</th><th>Estado</th></tr>'+lista+'</table></div>':''));
  $('#tpn').onchange=e=>{dtp=e.target.value;const p=S.sectores.find(x=>x.cod&&x.cem===cem&&dtp&&TPN[dtp].test(x.nombre));if(p&&p.cod!==cod)location.hash='#/disp/'+p.cod;else vDisp(cod);};
  $('#sp').onchange=e=>{location.hash='#/disp/'+e.target.value;};
  $('#nb').oninput=e=>{const q=e.target.value.trim();$('#nr').innerHTML=q?S.ubic.filter(u=>String(u.num).startsWith(q)).map(u=>'<div style="padding:3px 0"><a href="#/ficha/'+u.id+'">'+esc(ubicTxt(u.id))+'</a> '+tagEst(estadoU(u))+'</div>').join('')||'Sin coincidencias':'';};
}

/* ---- Ficha de la persona: encabezado y línea de tiempo ---- */
function anio(s){return s?s.slice(0,4):'';}
function heroPersona(i){
  const u=S.ubic.find(x=>x.id===i.ubic),s=u?sector(u.sec):null;
  const miga=u?[CEM[s.cem],(/^patio/i.test(s.nombre)?'':(u.tipo==='nicho'?'Pabellón ':'Patio '))+s.nombre,'Fila '+u.fila,'N° '+u.num]:[];
  const v=(anio(i.fnac)||'sin dato')+' – '+(anio(i.ffal)||'sin dato');
  return '<div class="hero"><img src="'+M_ESC+'" alt=""><div><h1>'+esc(nomCompl(i))+' '+tagEst(i.anulado?'anulado':i.estado)+(i.marca==='migrado'?' <span class="tag m">migrado</span>':'')+'</h1><p class="hv">'+v+' · N° de ingreso '+esc(i.id)+'</p><p class="miga">'+miga.map(esc).join(' <span aria-hidden="true">›</span> ')+'</p></div></div>';
}
function lineaTiempo(i){
  const ev=[];if(i.fsep)ev.push([i.fsep,'Sepultación','Ingreso '+i.id]);
  i.mov.forEach(m=>ev.push([m.fecha,m.tipo==='traslado'?'Traslado':'Exhumación',m.motivo+(m.res?' · '+m.res:'')]));
  S.certs.filter(c=>c.reg===i.id).forEach(c=>ev.push([c.fecha.slice(0,10),'Certificado '+(c.estado==='anulado'?'anulado':'emitido'),c.folio]));
  ev.sort((a,b)=>a[0]<b[0]?-1:1);
  return '<div class="card"><h2 style="margin-top:0">Línea de tiempo del registro</h2>'+(ev.length?'<ol class="lt" id="lt">'+ev.map(e=>'<li><span class="ltf">'+fdmy(e[0])+'</span><b>'+esc(e[1])+'</b><small>'+esc(e[2])+'</small></li>').join('')+'</ol>':'<p style="margin:0">Sin fechas en el origen.</p>')+'</div>';
}

/* ---- Certificados: flujo por pasos ---- */
function pasosCert(n){return '<ol class="stp" id="stp">'+['Tipo','Registro','Revisar datos','Emitir y verificar'].map((t,k)=>'<li class="'+(k+1<n?'hecho':k+1===n?'on':'')+'"><span>'+(k+1)+'</span>'+t+'</li>').join('')+'</ol>';}
function prevCert(t,r){if(!r)return '<p style="margin:0">No hay registros de este tipo en la muestra.</p>';const d=datosCert(t,r);return '<p class="kick" style="margin:0 0 6px">El sistema completa estos datos: no se redacta</p><dl class="k">'+d.lineas.map(l=>'<dt>'+esc(l[0])+'</dt><dd>'+esc(l[1])+'</dd>').join('')+'</dl>';}

/* ---- Vencimientos ---- */
let vf={cem:'',sec:''};
function pasaV(x){const u=S.ubic.find(y=>y.id===x.p.ubic),s=u?sector(u.sec):null;return(!vf.cem||(s&&s.cem===vf.cem))&&(!vf.sec||(u&&u.sec===vf.sec));}
function vVence(a){
  const t=a==='v'?'v':String(Number(a)||90),dd=Number(t)||90;const v=vencimientos().filter(x=>t==='v'?x.d<0:x.d>=0&&x.d<=dd).filter(pasaV).sort((x,y)=>x.d-y.d);
  const secs=[...new Set(vencimientos().map(x=>{const u=S.ubic.find(y=>y.id===x.p.ubic);return u?u.sec:'';}).filter(Boolean))];
  const tab=(k,l)=>'<a class="tab'+(t===k?' on':'')+'" href="#/vence/'+k+'">'+l+'</a>';
  const plazo=d=>d<0?'Venció hace '+(-d)+' día'+(d===-1?'':'s'):d===0?'Vence hoy':'Vence en '+d+' día'+(d===1?'':'s');
  marco('vence','<div class="hd"><div><h1>Control de vencimientos</h1><p class="sub">Arriendos de nichos y fosas, con el contacto del arrendatario.</p></div><div class="row"><div class="tabs">'+tab('v','Vencidos')+tab('30','30 días')+tab('60','60 días')+tab('90','90 días')+'</div><button class="btn sm" data-a="xls-vence" data-d="'+t+'">Exportar a Excel</button></div></div><div class="card"><div class="f"><div><label for="vfc">Cementerio</label><select id="vfc"><option value="">Ambos</option><option value="SC"'+(vf.cem==='SC'?' selected':'')+'>San Carlos</option><option value="CA"'+(vf.cem==='CA'?' selected':'')+'>Cachapoal</option></select></div><div><label for="vfs">Patio o pabellón</label><select id="vfs"><option value="">Todos</option>'+secs.map(c=>'<option value="'+esc(c)+'"'+(vf.sec===c?' selected':'')+'>'+esc(sector(c).nombre)+' ('+esc(c)+')</option>').join('')+'</select></div></div></div><div class="card tw"><table id="tvenc"><tr><th>Plazo</th><th>Ubicación</th><th>Arrendatario</th><th>Contacto</th><th>Período</th><th></th></tr>'+(v.map(x=>'<tr><td><b>'+plazo(x.d)+'</b><br><small>'+fdmy(x.p.fvenc)+'</small></td><td>'+esc(ubicTxt(x.p.ubic))+'</td><td>'+esc(nomCompl(x.p))+'</td><td>'+(esc(x.p.fono)||esc(x.p.dir)||'sin dato en origen')+'</td><td>'+esc(x.p.periodo)+'</td><td><a class="btn s sm" href="#/ficha/'+x.p.ubic+'">Abrir ficha</a></td></tr>').join('')||'<tr><td colspan="6">Sin arriendos en este tramo.</td></tr>')+'</table></div>');
  $('#vfc').onchange=e=>{vf.cem=e.target.value;vVence(a);};$('#vfs').onchange=e=>{vf.sec=e.target.value;vVence(a);};
}

/* ---- Acciones nuevas ---- */
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
  if(a==='imprimir'){const c=S.certs.find(x=>x.id===b.dataset.id);c.imp++;log('Certificados',c.folio,'impresión',[]);window.print();return;}
  if(a==='tip-next'){tipN=(tipN+1)%TIPS.length;$('#tip').outerHTML=tipCard();return;}
  if(a==='tip-close'){tipOff=true;$('#tip').remove();return;}
  if(a==='exc'){const x=S.exc.find(y=>y.id===b.dataset.id);x.est=b.dataset.r;log('Migración',x.id,'resolución de excepción',[{campo:x.regla+' '+x.campo,antes:x.orig,despues:x.est}]);msg('Excepción '+x.id+' resuelta: '+x.est+'. Quedó en el registro de auditoría.');vExc();return;}
  if(a==='ver-como'){log('Sesión',U.u,'cierre de sesión',[]);U=null;window.__pre=b.dataset.u;location.hash='#/';ruta();return;}
  if(a==='cel-sim'){ev.preventDefault();$('#pn').innerHTML='<div class="msg i" id="pnm">N° '+esc(b.dataset.num)+', fila '+esc(b.dataset.fila)+': '+esc(b.dataset.est)+'. Estado simulado: en la plataforma este número abre su ficha con la base migrada.</div>';return;}
  if(a==='xls-est'){const k=EST.parte[b.dataset.c||''];log('Estadísticas','','exportación',[]);dl(xlsx([['Tipo de propiedad','Total','Ocupado','Reservado','Disponible (cifras simuladas)'],...EST.tipos.map(t=>{const n=Math.round(t[1]*k),o=Math.round(n*t[2]/100),r=Math.round(n*t[3]/100);return[t[0],n,o,r,n-o-r];})],'Estadisticas'),'estadisticas.xlsx');return;}
});
document.addEventListener('submit',ev=>{if(ev.target.id!=='fqg')return;ev.preventDefault();qSt.q=$('#qg').value;qSt.todos=false;qSt.pag=0;if(location.hash==='#/buscar')ruta();else location.hash='#/buscar';});
/* Etiqueta flotante de los gráficos y de la grilla */
(()=>{const t=document.createElement('div');t.id='ttp';t.hidden=true;document.body.append(t);
 document.addEventListener('mouseover',e=>{const x=e.target.closest('[data-tip]');if(!x){t.hidden=true;return;}t.textContent=x.dataset.tip;t.hidden=false;});
 document.addEventListener('mousemove',e=>{if(t.hidden)return;t.style.left=Math.min(e.clientX+12,innerWidth-t.offsetWidth-8)+'px';t.style.top=(e.clientY+14)+'px';});})();
window.addEventListener('hashchange',ruta);
cargar();ruta();

/* ---- Búsqueda predictiva y bidireccional ---- */
let qSt={q:'',cem:'',tipo:'',est:'',d:'',h:'',todos:false,pag:0};
function buscar(q0){
  const q=norm(q0),out=[];if(!q)return out;const dig=/^[0-9][0-9.\-kK]*$/.test(q0.trim());
  if(!dig&&q.length<3)return out;const toks=q.split(/\s+/);
  const pasa=(cem,tp,est,ff)=>(!qSt.cem||cem===qSt.cem)&&(!qSt.tipo||tp===qSt.tipo)&&(!qSt.est||est===qSt.est)&&(!qSt.d||(ff&&ff>=qSt.d))&&(!qSt.h||(ff&&ff<=qSt.h));
  for(const i of S.inh){if(i.anulado)continue;const u=S.ubic.find(x=>x.id===i.ubic);const tx=norm([i.nom,i.ap,i.am].join(' '));let ok=toks.every(t=>tx.includes(t));
    if(!ok&&dig)ok=normRut(i.rut).includes(normRut(q0));
    if(ok&&pasa(u?sector(u.sec).cem:'',u?u.tipo:'',i.estado,i.ffal))out.push({k:'f',i,u,peso:tx.startsWith(toks[0])?0:1});}
  if(dig&&/^\d+(\.\d+)?$/.test(q0.trim())){for(const u of S.ubic)if(String(u.num).startsWith(q0.trim())&&pasa(sector(u.sec).cem,u.tipo,'',null))out.push({k:'u',u,peso:String(u.num)===q0.trim()?-1:2});}
  return out.sort((a,b)=>a.peso-b.peso);
}
function pintaRes(rs,mx){
  return rs.slice(0,mx).map(r=>{
    if(r.k==='f'){const i=r.i;const act=i.estado==='inhumado'?ubicTxt(i.ubic):(i.mov.length?'Última ubicación: '+ubicTxt(i.mov[i.mov.length-1].desde)+' · '+i.mov[i.mov.length-1].motivo:'');
      return '<a href="#/fallecido/'+i.id+'" class="res"><b>'+esc(nomCompl(i))+'</b> '+tagEst(i.estado)+(i.marca==='migrado'?' <span class="tag m">migrado</span>':'')+'<br><small>'+esc(act)+' · N° ingreso '+esc(i.id)+(i.rut?' · RUT '+esc(i.rut):'')+'</small></a>';}
    const u=r.u,ls=S.inh.filter(i=>i.ubic===u.id&&!i.anulado);
    return '<a href="#/ficha/'+u.id+'" class="res"><b>'+esc(ubicTxt(u.id))+'</b> '+tagEst(estadoU(u))+'<br><small>'+(ls.length?ls.map(i=>esc(nomCompl(i))).join(', '):'Sin fallecidos registrados')+'</small></a>';
  }).join('');
}
function vBuscar(){
  marco('buscar','<h1>Buscador de fallecidos y ubicaciones</h1><div class="card"><label for="q">Nombre, apellido, RUT (con o sin puntos) o número de sepultura o nicho</label><input id="q" autocomplete="off" placeholder="Ej.: Munoz · 12.345.678-5 · 184" value="'+esc(qSt.q)+'"><div id="res" class="sug" style="display:none"></div><p id="tm" style="font-size:12px;color:var(--ink3);margin:6px 0 0">Sugerencias desde el tercer carácter en texto y desde el primer dígito en números y RUT. No recarga la página.</p><div class="f" style="margin-top:10px"><div><label>Cementerio</label><select id="fc"><option value="">Todos</option><option value="SC">San Carlos</option><option value="CA">Cachapoal</option></select></div><div><label>Tipo de propiedad</label><select id="ft"><option value="">Todos</option><option value="nicho">Nicho</option><option value="sepultura">Sepultura</option><option value="fosa">Fosa patio común</option><option value="boveda">Bóveda</option><option value="mausoleo">Mausoleo</option></select></div><div><label>Estado</label><select id="fe"><option value="">Todos</option><option value="inhumado">Inhumado</option><option value="exhumado">Exhumado o trasladado</option></select></div><div><label>Fallecimiento desde</label><input id="fd" type="date"></div><div><label>hasta</label><input id="fh" type="date"></div></div></div>');
  const pinta=()=>{const q=$('#q').value;qSt.q=q;const t0=performance.now();const rs=buscar(q);const res=$('#res');
    if(!q.trim()||(!/^[0-9]/.test(q.trim())&&norm(q).length<3)){res.style.display='none';res.innerHTML='';return;}
    res.style.display='block';
    const por=20,mx=qSt.todos?por*(qSt.pag+1):20;
    res.innerHTML=(rs.length?pintaRes(rs,mx):'<a>Sin coincidencias</a>')+(rs.length>mx?'<a href="#" id="vt"><b>Ver todos ('+rs.length+')</b></a>':'');
    $('#tm').textContent=rs.length+' coincidencia(s) en '+(performance.now()-t0).toFixed(1)+' ms';
    const vt=$('#vt');if(vt)vt.onclick=e=>{e.preventDefault();qSt.todos=true;qSt.pag++;pinta();};};
  $('#q').oninput=()=>{qSt.todos=false;qSt.pag=0;pinta();};
  [['#fc','cem'],['#ft','tipo'],['#fe','est'],['#fd','d'],['#fh','h']].forEach(([s,k])=>{const e=$(s);e.value=qSt[k];e.onchange=()=>{qSt[k]=e.value;pinta();};});
  pinta();$('#q').focus();
}

/* ---- Disponibilidad: mapa de nichos ---- */
function vDisp(a){
  const secs=S.sectores.filter(s=>S.ubic.some(u=>u.sec===s.cod));const cod=a||'R';const s=sector(cod);
  const min=Number(s.min)||0,max=Number(s.max)||0,n=Math.min(max-min+1,160);
  let cells='';
  if(n>0){const cs=[];for(let k=0;k<n;k++){const num=String(min+k);const u=S.ubic.find(x=>x.sec===cod&&String(x.num)===num);
      if(u){const e=estadoU(u);cs.push('<a class="cell '+e[0]+'" href="#/ficha/'+u.id+'" title="'+e+'">'+num+'</a>');}
      else cs.push('<a class="cell d" href="#" data-a="crear-ub" data-sec="'+cod+'" data-num="'+num+'" title="disponible">'+num+'</a>');}
    cells='<div class="cells">'+cs.join('')+'</div>';}
  const lista=S.ubic.filter(u=>u.sec===cod).map(u=>'<tr><td><a href="#/ficha/'+u.id+'">'+esc(u.num)+'</a></td><td>'+esc(u.fila)+'</td><td>'+esc(u.tipo)+'</td><td>'+tagEst(estadoU(u))+'</td></tr>').join('');
  marco('disp','<h1>Control de disponibilidad</h1><div class="card"><div class="f"><div><label>Patio o pabellón</label><select id="sp">'+secs.map(x=>'<option value="'+x.cod+'"'+(x.cod===cod?' selected':'')+'>'+esc(x.nombre)+' ('+x.cod+')</option>').join('')+'</select></div><div><label>Buscar número (estado al instante)</label><input id="nb" placeholder="Número de sepultura o nicho" autocomplete="off"></div></div><div id="nr" style="margin-top:8px"></div></div><div class="card"><div class="row" style="margin-bottom:10px"><b>'+esc(s.nombre)+'</b><span class="tag">rango '+esc(s.min||'sin rango')+' a '+esc(s.max||'')+'</span><span class="tag ok">disponible</span><span class="tag">ocupado</span><span class="tag w">reservado</span></div>'+(cells||'<p>Sector sin rango de numeración en la muestra.</p>')+(max-min+1>160?'<p style="font-size:12px;color:var(--ink3)">Se muestran los primeros 160 números del rango.</p>':'')+'<p style="font-size:12px;color:var(--ink3);margin-bottom:0">Los números sin registro se muestran como disponibles solo en esta muestra de 20 filas.</p></div><div class="card tw"><table><tr><th>N°</th><th>Fila</th><th>Tipo</th><th>Estado</th></tr>'+lista+'</table></div>');
  $('#sp').onchange=e=>{location.hash='#/disp/'+e.target.value;};
  $('#nb').oninput=e=>{const q=e.target.value.trim();$('#nr').innerHTML=q?S.ubic.filter(u=>String(u.num).startsWith(q)).map(u=>'<div style="padding:3px 0"><a href="#/ficha/'+u.id+'">'+esc(ubicTxt(u.id))+'</a> '+tagEst(estadoU(u))+'</div>').join('')||'Sin coincidencias':'';};
}

const adjTemp={};
function leerAdj(id){return new Promise((ok,no)=>{if(adjTemp[id])return ok(adjTemp[id]);const f=$('#'+id).files[0];if(!f)return ok(null);
  if(!/\.(pdf|jpe?g|png)$/i.test(f.name))return no('Tipo de archivo rechazado: solo PDF, JPG y PNG.');if(f.size>10*1024*1024)return no('Archivo rechazado: supera 10 MB.');

  t.transferencias=[['id_ubicacion','propietario_anterior','propietario_nuevo','fecha','documento','nota'],...S.transf.map(x=>[x.ubic,x.antes,x.nuevo,x.fecha,x.doc,x.nota||''])];

  return t;
}
function sqlSalida(t){
  let s='-- Respaldo completo en SQL estandar, ejecutable en PostgreSQL. Datos ficticios de demostracion.\n';
  for(const k of Object.keys(t)){const c=t[k][0];s+='CREATE TABLE '+k+' ('+c.map(x=>x+' TEXT').join(', ')+');\n';
    for(const r of t[k].slice(1))s+='INSERT INTO '+k+' ('+c.join(', ')+') VALUES ('+r.map(v=>"'"+String(v==null?'':v).replace(/'/g,"''")+"'").join(', ')+');\n';}
  return s;
}
function generarSalida(){
  const t=tablasSalida(),fs=[];
  for(const k of Object.keys(t))fs.push({name:'csv/'+k+'.csv',data:csv(t[k])});
  fs.push({name:'sql/respaldo_completo.sql',data:sqlSalida(t)});
  const idx=[['archivo','id_registro','nombre_original']];
  S.adj.forEach(a=>{const n='adjuntos/'+a.reg+'/'+a.id+'-'+a.nombre;fs.push({name:n,data:unb64(a.data)});idx.push([n,a.reg,a.nombre]);});
  fs.push({name:'adjuntos/indice.csv',data:csv(idx)});
  S.certs.forEach(c=>fs.push({name:'certificados/'+c.folio+'.pdf',data:pdfCert(c)}));
  fs.push({name:'certificados/tabla_verificacion.csv',data:csv(t.verificacion_certificados)});
  fs.push({name:'auditoria/log.csv',data:csv([['seq','fecha_hora','usuario','rut','perfil','ip','modulo','registro','operacion','cambios','resultado','huella_anterior','huella'],...S.log.map(e=>[e.seq,e.ts,e.usuario,e.rut,e.perfil,e.ip,e.modulo,e.registro,e.op,JSON.stringify(e.cambios),e.resultado,e.prev,e.hash])])});
  fs.push({name:'configuracion/catalogos_usuarios_perfiles.json',data:JSON.stringify({periodos:S.periodos,tipos_exhumacion:S.tiposEx,usuarios:USERS.map(u=>({usuario:u.u,perfil:u.perfil})),adjuntos_obligatorios:S.cfgAdj},null,1)});
  fs.push({name:'configuracion/plantillas_certificados.json',data:JSON.stringify(TIPOC,null,1)});
  const man=fs.map(f=>sha256(toBytes(f.data))+'  '+f.name).join('\n')+'\n';
  fs.push({name:'manifiesto_sha256.txt',data:man});
  return {zip:zipStore(fs),n:fs.length,fs};
}
